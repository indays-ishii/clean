<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="清掃の管理">
<meta name="theme-color" content="#f6f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121411" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>清掃の管理</title>
<!--
  OCHAHOUSE 清掃の管理（運営メンバー用。GitHub Pages: indays-ishii/clean/admin/）
  ishiiさん決定 2026-09-27：最重要は清掃のし忘れを見逃さないこと。スマホで見やすく。
    - 上に「今日の要注意」（期限切れ・今日締切で未清掃）をいつも出す
    - 基本は「日ごと」（週の帯で日を選ぶ → その日のチェックインの部屋と清掃の状態）。タブで「一覧表」（部屋×日付）
    - 部屋を押すと詳細：次・前のゲスト（予約経路・人数・時刻）、注意、写真、履歴、操作
    - 操作：写真なしで完了／取り消し／清掃不要／期限を手で直す／運営メモ／臨時の清掃を追加
  データ：Cloudflare Workers の受け口（運営メンバー用の合言葉）。予約はMac miniが30分おきに書き置く一覧。
-->
<style>
  :root {
    --bg: #f6f6f2; --card: #ffffff; --ink: #1d1f1b; --sub: #6d7169; --muted: #a4a79f; --line: #e6e7e1; --line2: #d5d7cf;
    --matcha: #5b8e3e; --matcha-ink: #3f6a28; --matcha-bg: #edf3e6;
    --red: #c4442c; --red-ink: #a33520; --red-line: #eeb8ab; --red-bg: #fcefeb;
    --amber: #8a6512; --amber-bg: #fbf3df; --gray-bg: #efefeb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121411; --card: #1b1d1a; --ink: #eef0ea; --sub: #a1a59c; --muted: #6c7068; --line: #2a2d28; --line2: #3a3e37;
      --matcha: #7fb65c; --matcha-ink: #a9d68a; --matcha-bg: #1f2c18;
      --red: #ff7a5e; --red-ink: #ff9a84; --red-line: #6e2f23; --red-bg: #2f1a15; --amber: #e0b85a; --amber-bg: #2c2512; --gray-bg: #242622; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  main { max-width: 560px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom)); }

  header { display: flex; align-items: flex-end; justify-content: space-between; margin: 4px 4px 14px; }
  h1 { font-size: 24px; font-weight: 700; margin: 0; }
  .sub { color: var(--sub); font-size: 12px; margin-top: 3px; }

  /* 今日の要注意 */
  .alert { border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; }
  .alert.bad { background: var(--red-bg); border: 1px solid var(--red-line); }
  .alert.good { background: var(--matcha-bg); color: var(--matcha-ink); font-size: 14px; font-weight: 600; }
  .alert .t { font-size: 13px; font-weight: 700; color: var(--red-ink); margin-bottom: 6px; }
  .alert button { display: flex; width: 100%; gap: 10px; align-items: baseline; border: 0; background: none; padding: 5px 0; text-align: left; }
  .alert .tm { font-weight: 700; color: var(--red-ink); width: 50px; flex: none; font-variant-numeric: tabular-nums; }
  .alert .rm { flex: 1; font-weight: 600; }
  .alert .why { font-size: 12px; color: var(--red-ink); }

  /* 週の切り替えとタブ */
  .bar { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .nav { display: flex; align-items: center; gap: 2px; }
  .nav button { width: 34px; height: 36px; border-radius: 10px; border: 0; background: var(--card); box-shadow: 0 0 0 1px var(--line) inset; }
  .nav span { font-size: 14px; font-weight: 600; padding: 0 5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .thisweek { border: 0; background: none; color: var(--matcha-ink); font-size: 13px; font-weight: 600; padding: 6px 2px; white-space: nowrap; }
  .seg { margin-left: auto; display: flex; background: var(--gray-bg); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 6px 10px; white-space: nowrap; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--sub); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* 日ごと：週の帯 */
  .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 12px; }
  .strip button { border: 0; background: var(--card); border-radius: 12px; padding: 7px 0 6px; box-shadow: 0 0 0 1px var(--line) inset; line-height: 1.25; }
  .strip .w { font-size: 11px; color: var(--sub); }
  .strip .d { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .strip .c { font-size: 11px; font-weight: 700; height: 15px; }
  .strip button.today .d { color: var(--matcha-ink); }
  .strip button.on { background: var(--ink); box-shadow: none; }
  .strip button.on .w, .strip button.on .d { color: var(--bg); }
  .c.ok { color: var(--matcha); } .c.warn { color: var(--amber); } .c.hot { color: var(--red); } .c.plan { color: var(--muted); }
  .strip button.on .c.plan, .strip button.on .c.none { color: var(--muted); }

  .cap { font-size: 12px; font-weight: 700; color: var(--sub); margin: 14px 4px 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 12px; text-align: left; }
  .item + .item { border-top: 1px solid var(--line); }
  .item:active { background: var(--matcha-bg); }
  .item .tm { width: 46px; flex: none; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .item .tm.hot { color: var(--red); }
  .item .nm { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; }
  .item .nm small { display: block; font-size: 12px; font-weight: 400; color: var(--sub); margin-top: 2px; }
  .item .nm small .early { color: var(--red); font-weight: 600; }
  .empty { padding: 18px; text-align: center; color: var(--sub); font-size: 14px; }

  .chip { flex: none; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .chip.ok { background: var(--matcha-bg); color: var(--matcha-ink); }
  .chip.warn { background: var(--amber-bg); color: var(--amber); }
  .chip.hot { background: var(--red-bg); color: var(--red-ink); }
  .chip.plan, .chip.none { background: var(--gray-bg); color: var(--sub); }

  .addBtn { display: block; width: 100%; margin-top: 16px; height: 46px; border-radius: 14px; border: 1px dashed var(--line2); background: transparent; color: var(--sub); font-size: 14px; }

  /* 一覧表（部屋×日付） */
  .grid { display: grid; grid-template-columns: 62px repeat(7, 1fr); gap: 3px; font-size: 11px; }
  .grid .h { text-align: center; color: var(--sub); line-height: 1.25; padding: 2px 0 4px; font-size: 10px; }
  .grid .h b { display: block; font-size: 13px; color: var(--ink); }
  .grid .h.today b { color: var(--matcha-ink); }
  .grid .rn { display: flex; align-items: center; font-weight: 600; font-size: 11px; line-height: 1.2; }
  .grid .cell { height: 38px; border: 0; border-radius: 7px; padding: 0; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; background: transparent; color: var(--muted); }
  .cell.ok { background: var(--matcha-bg); color: var(--matcha-ink); }
  .cell.warn { background: var(--amber-bg); color: var(--amber); }
  .cell.hot { background: var(--red-bg); color: var(--red-ink); }
  .cell.plan, .cell.none { background: var(--gray-bg); color: var(--sub); }
  .cell.stay { color: var(--line2); font-size: 16px; }
  .legend { font-size: 11px; color: var(--sub); margin: 10px 2px 0; line-height: 1.8; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin: 0 3px 0 8px; }

  /* 詳細・追加（全画面シート） */
  .sheet { position: fixed; inset: 0; z-index: 12; background: var(--bg); display: none; flex-direction: column; padding-top: env(safe-area-inset-top); }
  .sheet.on { display: flex; }
  .shead { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .shead .t { flex: 1; min-width: 0; }
  .shead .t b { display: block; font-size: 19px; }
  .shead .t span { font-size: 12px; color: var(--sub); }
  .x { width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--line); display: flex; align-items: center; justify-content: center; flex: none; }
  .x svg { width: 18px; height: 18px; }
  .sbody { flex: 1; overflow-y: auto; padding: 14px 14px calc(30px + env(safe-area-inset-bottom)); max-width: 560px; width: 100%; margin: 0 auto; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; }
  .box .lb { font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 6px; }
  .kv { display: flex; gap: 10px; padding: 3px 0; font-size: 14px; }
  .kv .k { width: 64px; flex: none; color: var(--sub); font-size: 13px; }
  .kv .v { flex: 1; min-width: 0; }
  .note { background: var(--amber-bg); color: var(--amber); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.5; }
  textarea, input[type=datetime-local], input[type=date], select { width: 100%; border: 1px solid var(--line2); border-radius: 10px; background: var(--bg); padding: 10px; font-size: 15px; }
  textarea { min-height: 70px; resize: vertical; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { height: 46px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card); font-size: 14px; font-weight: 600; }
  .btn.pri { background: var(--matcha); border-color: var(--matcha); color: #fff; }
  .btn.dan { color: var(--red); }
  .btn.full { grid-column: 1 / -1; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .photos button { padding: 0; border: 0; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--line); }
  .photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hist button { display: flex; width: 100%; justify-content: space-between; border: 0; background: none; padding: 8px 0; font-size: 14px; }
  .hist button + button { border-top: 1px solid var(--line); }
  .hist span { color: var(--sub); font-size: 12px; }

  .lbx { position: fixed; inset: 0; z-index: 14; background: #000; display: none; }
  .lbx.on { display: block; }
  .lbx .strip2 { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .lbx .strip2::-webkit-scrollbar { display: none; }
  .lbx .strip2 div { flex: 0 0 100%; height: 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; }
  .lbx img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lbx .x { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 14px; background: rgba(255,255,255,.18); color: #fff; }
  .lbx .count { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); text-align: center; color: rgba(255,255,255,.8); font-size: 13px; }

  .veil { position: fixed; inset: 0; background: rgba(10,12,10,.5); display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
  .veil.on { display: flex; }
  .pbox { background: var(--card); border-radius: 24px; padding: 26px 22px 20px; width: min(92vw, 400px); text-align: center; }
  .pbox .t { font-size: 19px; font-weight: 700; }
  .pbox input { width: 100%; font-size: 20px; padding: 13px; border-radius: 14px; border: 1px solid var(--line2); background: var(--bg); margin: 16px 0 6px; text-align: center; }
  .pbox .err { color: var(--red); font-size: 14px; min-height: 1.4em; }
  .pbox button { width: 100%; height: 50px; font-size: 16px; font-weight: 700; color: #fff; background: var(--matcha); border: 0; border-radius: 14px; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(16px); bottom: calc(22px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg);
    padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: .25s; z-index: 30; white-space: nowrap; pointer-events: none; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.bad { background: var(--red); color: #fff; }
  .ask { position: fixed; inset: 0; background: rgba(10,12,10,.45); display: none; align-items: flex-end; justify-content: center; z-index: 25;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
  .ask.on { display: flex; }
  .ask .panel { width: min(100%, 520px); background: var(--card); border-radius: 22px; padding: 22px 16px 10px; text-align: center; }
  .ask .q { white-space: pre-line; font-size: 17px; font-weight: 600; line-height: 1.5; margin-bottom: 16px; }
  .ask button { display: block; width: 100%; height: 50px; border: 0; border-radius: 14px; font-size: 16px; font-weight: 700; }
  .ask .yes { background: var(--red); color: #fff; }
  .ask .no { background: transparent; color: var(--sub); font-weight: 400; margin-top: 2px; }
  .foot { text-align: center; color: var(--muted); font-size: 11px; margin-top: 22px; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>清掃の管理</h1><div class="sub" id="sub">&nbsp;</div></div>
  </header>
  <div id="alert"></div>
  <div class="bar">
    <div class="nav"><button data-act="week" data-v="-1" aria-label="前の週">‹</button><span id="range"></span><button data-act="week" data-v="1" aria-label="次の週">›</button></div>
    <button class="thisweek" id="thisweek" data-act="week" data-v="0">今週</button>
    <div class="seg"><button data-act="tab" data-v="day" id="tabDay" class="on">日ごと</button><button data-act="tab" data-v="grid" id="tabGrid">一覧表</button></div>
  </div>
  <div id="view"></div>
  <button class="addBtn" data-act="add">＋ 臨時の清掃を追加</button>
  <div class="foot" id="foot"></div>
</main>

<div class="sheet" id="sheet">
  <div class="shead"><div class="t"><b id="sTitle"></b><span id="sSub"></span></div><button class="x" data-act="close" aria-label="閉じる"></button></div>
  <div class="sbody" id="sBody"></div>
</div>
<div class="lbx" id="lbx"><div class="strip2" id="lbStrip"></div><button class="x" data-act="closeLb" aria-label="閉じる"></button><div class="count" id="lbCount"></div></div>
<div class="veil" id="veil">
  <form class="pbox" id="passForm">
    <div class="t">運営メンバー用の合言葉</div>
    <input id="passInput" autocomplete="off" autocapitalize="off" enterkeyhint="go">
    <div class="err" id="passErr"></div>
    <button type="submit">はじめる</button>
  </form>
</div>
<div class="ask" id="ask"><div class="panel"><div class="q" id="askQ"></div><button class="yes" id="askYes"></button><button class="no" id="askNo">やめる</button></div></div>
<div class="toast" id="toast"></div>

<script>
  const API_URL = 'https://ochahouse-clean-api.ishii-8e0.workers.dev';
  const PASS_KEY = 'ochahouse-admin-pass', CACHE_KEY = 'ochahouse-admin-cache';
  const WD = '日月火水木金土';
  const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  let D = null;                  // 受け口からのデータ {today, now, rooms, tasks, bookings}
  let weekOff = 0, tab = 'day', selDay = '', cur = null, lbUrls = [];

  // ---------------------------------------------------------------- 小道具
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const hm = (iso) => { const m = /T(\d\d:\d\d)/.exec(iso || ''); return m ? m[1] : ''; };
  const jstNow = () => new Date(Date.now() + 9 * 3600000);
  const jstToday = () => jstNow().toISOString().slice(0, 10);
  const addDays = (ymd, n) => new Date(Date.parse(ymd + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
  const md = (ymd) => { const d = new Date(ymd + 'T00:00:00Z'); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); };
  const mdw = (ymd) => md(ymd) + ' ' + WD[new Date(ymd + 'T00:00:00Z').getUTCDay()];
  const weekStart = () => { const t = jstToday(), w = new Date(t + 'T00:00:00Z').getUTCDay(); return addDays(t, -w + weekOff * 7); };
  const days = () => { const s = weekStart(); return Array.from({ length: 7 }, (_, i) => addDays(s, i)); };
  function toast(m, bad) { const t = document.getElementById('toast'); t.textContent = m; t.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', bad ? 4500 : 2200); }

  // ---------------------------------------------------------------- 合言葉と受け口
  const getPass = () => { try { return localStorage.getItem(PASS_KEY) || ''; } catch (e) { return window._p || ''; } };
  const setPass = (v) => { window._p = v; try { v ? localStorage.setItem(PASS_KEY, v) : localStorage.removeItem(PASS_KEY); } catch (e) {} };
  function askPass(msg) { document.getElementById('passErr').textContent = msg || ''; document.getElementById('veil').classList.add('on'); setTimeout(() => document.getElementById('passInput').focus(), 60); }
  document.getElementById('passForm').addEventListener('submit', (e) => {
    e.preventDefault(); const v = document.getElementById('passInput').value.trim(); if (!v) return;
    setPass(v); document.getElementById('veil').classList.remove('on'); load();
  });
  async function api(action, extra) {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ pass: getPass(), action }, extra || {})) });
    const j = await r.json();
    if (!j.ok && j.error === 'passcode') { setPass(''); askPass('合言葉がちがいます'); throw { silent: true }; }
    if (!j.ok) throw new Error(j.error || 'エラー');
    return j.data;
  }

  // ---------------------------------------------------------------- 予約と清掃タスクの突き合わせ
  const B = () => (D && D.bookings && D.bookings.bookings) || [];
  const T = () => (D && D.tasks) || [];
  const inOn = (room, day) => B().find(b => b.room === room && b.in === day);
  const outOn = (room, day) => B().find(b => b.room === room && b.out === day);
  const stayOn = (room, day) => B().find(b => b.room === room && b.in < day && day < b.out);
  const taskDue = (room, day) => T().find(t => t.room === room && (t.due || '').slice(0, 10) === day);
  const taskOut = (room, day) => T().find(t => t.room === room && t.day === day);
  const prevOf = (room, day) => B().filter(b => b.room === room && b.out <= day).sort((a, b) => a.out < b.out ? 1 : -1)[0];
  const nextOf = (room, day) => B().filter(b => b.room === room && b.in >= day).sort((a, b) => a.in < b.in ? -1 : 1)[0];

  // 清掃の状態 → {cls, label}
  function st(t) {
    if (!t) return { cls: 'none', label: '空室から' };   // 前の清掃のあとチェックアウトが無かった部屋
    if (t.status === '完了') return { cls: 'ok', label: '✅ 清掃済み' };
    if (t.status === 'キャンセル') return { cls: 'none', label: '清掃不要' };
    const today = D.today, now = new Date();
    if (t.day > today) return { cls: 'plan', label: '🗓 予定' };
    if (t.due && new Date(t.due) < now) return { cls: 'hot', label: '🚨 期限切れ' };
    if (t.due && t.due.slice(0, 10) === today) return { cls: 'hot', label: '⚠️ 今日締切' };
    return { cls: 'warn', label: '⚠️ 未清掃' };
  }
  const worst = (list) => ['hot', 'warn', 'plan', 'ok', 'none'].find(c => list.includes(c)) || 'none';

  // ---------------------------------------------------------------- 画面
  function render() {
    if (!D) return;
    const today = D.today, ds = days(), made = (D.bookings && D.bookings.made) || '';
    document.getElementById('sub').textContent = mdw(today) + (made ? '・予約 ' + md(made.slice(0, 10)) + ' ' + made.slice(11, 16) + ' 時点' : '');
    document.getElementById('range').textContent = md(ds[0]) + '〜' + md(ds[6]);
    document.getElementById('thisweek').style.visibility = weekOff ? 'visible' : 'hidden';
    document.getElementById('tabDay').className = tab === 'day' ? 'on' : '';
    document.getElementById('tabGrid').className = tab === 'grid' ? 'on' : '';

    // 今日の要注意（期限切れ・今日締切で未清掃）
    const now = new Date();
    const warn = T().filter(t => t.status !== '完了' && t.status !== 'キャンセル' && t.due && (new Date(t.due) < now || t.due.slice(0, 10) === today))
      .sort((a, b) => a.due < b.due ? -1 : 1);
    document.getElementById('alert').innerHTML = warn.length
      ? '<div class="alert bad"><div class="t">今日の要注意 ' + warn.length + '件</div>' + warn.map(t => {
          const over = new Date(t.due) < now;
          return '<button data-act="task" data-v="' + t.id + '"><span class="tm">' + (t.due.slice(0, 10) === today ? hm(t.due) : md(t.due.slice(0, 10))) + '</span><span class="rm">' + esc(t.room)
            + '</span><span class="why">' + (over ? '期限切れ・未清掃' : hm(t.due) + 'までに未清掃') + '</span></button>';
        }).join('') + '</div>'
      : '<div class="alert good">✅ 今日の要注意はありません</div>';

    document.getElementById('view').innerHTML = tab === 'day' ? dayView(ds) : gridView(ds);
    document.getElementById('foot').textContent = D.bookings && D.bookings.ok && (D.bookings.ok.AirHost === false || D.bookings.ok['麻布十番'] === false)
      ? '予約の一部が読めていません（' + Object.keys(D.bookings.ok).filter(k => !D.bookings.ok[k]).join('・') + '）' : '';
  }

  function dayView(ds) {
    if (!ds.includes(selDay)) selDay = ds.includes(D.today) ? D.today : ds[0];
    const rooms = D.rooms;
    let h = '<div class="strip">' + ds.map(d => {
      const ins = rooms.map(r => inOn(r, d)).filter(Boolean);
      const cls = ins.length ? worst(ins.map(b => st(taskDue(b.room, d)).cls)) : 'none';
      return '<button data-act="day" data-v="' + d + '" class="' + (d === selDay ? 'on ' : '') + (d === D.today ? 'today' : '') + '"><div class="w">' + WD[new Date(d + 'T00:00:00Z').getUTCDay()]
        + '</div><div class="d">' + Number(d.slice(8)) + '</div><div class="c ' + cls + '">' + (ins.length || '') + '</div></button>';
    }).join('') + '</div>';

    const inTime = (b) => { const t = taskDue(b.room, selDay); return t && t.due ? hm(t.due) : b.tin; };
    const ins = rooms.map(r => inOn(r, selDay)).filter(Boolean).sort((a, b) => inTime(a) < inTime(b) ? -1 : 1);
    h += '<div class="cap">' + mdw(selDay) + ' のチェックイン</div><div class="card">' + (ins.length ? ins.map(b => {
      const t = taskDue(b.room, selDay), s = st(t), due = t && t.due ? hm(t.due) : b.tin, early = t && /アーリー/.test(t.deadline);
      return '<button class="item" data-act="open" data-room="' + esc(b.room) + '" data-day="' + selDay + '" data-kind="in"><span class="tm' + (s.cls === 'hot' ? ' hot' : '') + '">' + due + '</span>'
        + '<span class="nm">' + esc(b.room) + '<small>' + esc(b.ch || '') + (b.n ? '・' + b.n + '名' : '') + (early ? '・<span class="early">アーリー</span>' : '') + '</small></span>'
        + '<span class="chip ' + s.cls + '">' + s.label + '</span></button>';
    }).join('') : '<div class="empty">チェックインはありません</div>') + '</div>';

    const outs = rooms.map(r => outOn(r, selDay)).filter(Boolean).sort((a, b) => a.tout < b.tout ? -1 : 1);
    if (outs.length) {
      h += '<div class="cap">' + mdw(selDay) + ' のチェックアウト</div><div class="card">' + outs.map(b => {
        const t = taskOut(b.room, selDay), s = st(t);
        return '<button class="item" data-act="open" data-room="' + esc(b.room) + '" data-day="' + selDay + '" data-kind="out"><span class="tm">' + b.tout + '</span>'
          + '<span class="nm">' + esc(b.room) + '<small>' + esc(b.ch || '') + (t && t.due ? '・次のIN ' + md(t.due.slice(0, 10)) + ' ' + hm(t.due) : '・次の予約なし') + '</small></span>'
          + '<span class="chip ' + s.cls + '">' + s.label + '</span></button>';
      }).join('') + '</div>';
    }
    return h;
  }

  function gridView(ds) {
    let h = '<div class="grid"><div></div>' + ds.map(d => '<div class="h' + (d === D.today ? ' today' : '') + '">' + WD[new Date(d + 'T00:00:00Z').getUTCDay()] + '<b>' + Number(d.slice(8)) + '</b></div>').join('');
    D.rooms.forEach(r => {
      h += '<div class="rn">' + esc(r.replace('麻布十番', '麻布')) + '</div>';
      ds.forEach(d => {
        const i = inOn(r, d), o = outOn(r, d);
        let txt = '·', cls = '', kind = '';
        if (i && o) { txt = '⇄'; cls = st(taskDue(r, d)).cls; kind = 'in'; }
        else if (i) { txt = 'IN'; cls = st(taskDue(r, d)).cls; kind = 'in'; }
        else if (o) { txt = 'OUT'; cls = st(taskOut(r, d)).cls; kind = 'out'; }
        else if (stayOn(r, d)) { txt = '━'; cls = 'stay'; }
        h += kind ? '<button class="cell ' + cls + '" data-act="open" data-room="' + esc(r) + '" data-day="' + d + '" data-kind="' + kind + '">' + txt + '</button>'
                  : '<div class="cell ' + cls + '">' + txt + '</div>';
      });
    });
    return h + '</div><div class="legend">━ 滞在中　· 空室　⇄ 同じ日にOUTとIN<br>'
      + '<i style="background:var(--matcha-bg)"></i>清掃済み<i style="background:var(--amber-bg)"></i>未清掃<i style="background:var(--red-bg)"></i>今日締切・期限切れ<i style="background:var(--gray-bg)"></i>予定</div>';
  }

  // ---------------------------------------------------------------- 部屋の詳細
  function openSheet(title, sub, body) {
    document.getElementById('sTitle').textContent = title;
    document.getElementById('sSub').textContent = sub;
    document.getElementById('sBody').innerHTML = body;
    document.querySelector('.shead .x').innerHTML = ICON_X;
    document.getElementById('sheet').classList.add('on');
    document.getElementById('sBody').scrollTop = 0;
  }
  function closeSheet() { cur = null; document.getElementById('sheet').classList.remove('on'); }

  function guestBox(label, b, kind) {
    if (!b) return '<div class="box"><div class="lb">' + label + '</div><div class="kv"><span class="v" style="color:var(--sub)">予約なし</span></div></div>';
    return '<div class="box"><div class="lb">' + label + '</div>'
      + '<div class="kv"><span class="k">' + (kind === 'in' ? 'IN' : 'OUT') + '</span><span class="v">' + mdw(kind === 'in' ? b.in : b.out) + ' ' + (kind === 'in' ? b.tin : b.tout) + '</span></div>'
      + (b.guest ? '<div class="kv"><span class="k">ゲスト</span><span class="v">' + esc(b.guest) + (b.n ? '（' + b.n + '名）' : '') + '</span></div>' : '')
      + '<div class="kv"><span class="k">予約経路</span><span class="v">' + esc(b.ch || '不明') + '</span></div>'
      + '<div class="kv"><span class="k">滞在</span><span class="v">' + md(b.in) + '〜' + md(b.out) + '</span></div></div>';
  }

  async function openDetail(room, day, kind, taskId) {
    let t = taskId ? T().find(x => x.id === taskId) : kind === 'in' ? taskDue(room, day) : taskOut(room, day);
    if (t && !taskId) taskId = t.id;
    const cleanDay = t ? t.day : kind === 'out' ? day : '';
    const nxt = kind === 'in' ? inOn(room, day) : nextOf(room, t && t.day ? t.day : day);
    const prv = kind === 'out' ? outOn(room, day) : prevOf(room, nxt ? nxt.in : day);
    cur = { room, day, kind, taskId: t ? t.id : '' };
    const s = st(t);
    let h = '<div class="box"><div class="lb">清掃</div>'
      + '<div class="kv"><span class="k">状態</span><span class="v"><span class="chip ' + s.cls + '">' + s.label + '</span></span></div>'
      + (t ? '<div class="kv"><span class="k">期限</span><span class="v">' + esc(t.deadline || (t.due ? mdw(t.due.slice(0, 10)) + ' ' + hm(t.due) : '次の予約なし')) + '</span></div>'
           + (cleanDay ? '<div class="kv"><span class="k">清掃日</span><span class="v">' + mdw(cleanDay) + ' 〜（チェックアウト後）</span></div>' : '')
           + (t.doneAt ? '<div class="kv"><span class="k">完了</span><span class="v">' + mdw(t.doneAt.slice(0, 10)) + ' ' + hm(t.doneAt) + '・写真' + t.photos + '枚</span></div>' : '')
         : '<div class="kv"><span class="v" style="color:var(--sub)">この日の清掃タスクはありません（空室だった部屋など）</span></div>')
      + (t && t.note ? '<div class="note" style="margin-top:8px">' + esc(t.note) + '</div>' : '') + '</div>';
    h += guestBox('次のゲスト', nxt, 'in') + guestBox('前のゲスト', prv, 'out');
    if (t) {
      h += '<div class="box"><div class="lb">写真</div><div class="photos" id="dPhotos">' + (t.photos || t.status === '完了' ? '<div class="empty" style="grid-column:1/-1">読み込み中…</div>' : '<div class="empty" style="grid-column:1/-1">まだありません</div>') + '</div></div>';
      h += '<div class="box"><div class="lb">運営メモ（清掃会社の画面にも出ます）</div><textarea id="dMemo" placeholder="例：シーツを2セット使う">' + esc(t.memo) + '</textarea>'
        + '<div class="btns" style="margin-top:8px"><button class="btn full" data-act="memo">メモを保存</button></div></div>';
      h += '<div class="box"><div class="lb">操作</div><div class="btns">'
        + (t.status === '完了' ? '<button class="btn dan full" data-act="op" data-v="undo">完了を取り消す（写真も外れます）</button>'
          : t.status === 'キャンセル' ? '<button class="btn full" data-act="op" data-v="restore">清掃不要を元に戻す</button>'
          : '<button class="btn pri" data-act="op" data-v="complete">完了にする</button><button class="btn dan" data-act="op" data-v="cancel">清掃不要にする</button>')
        + '</div><div class="lb" style="margin-top:12px">期限を直す</div><input type="datetime-local" id="dDue" value="' + (t.due ? t.due.slice(0, 16) : '') + '">'
        + '<div class="btns" style="margin-top:8px"><button class="btn full" data-act="due">期限を保存</button></div></div>';
    } else {
      h += '<div class="btns"><button class="btn pri full" data-act="add" data-room="' + esc(room) + '" data-day="' + day + '">この部屋に臨時の清掃を追加</button></div>';
    }
    h += '<div class="box" style="margin-top:12px"><div class="lb">この部屋の最近の清掃</div><div class="hist" id="dHist"><div class="empty">読み込み中…</div></div></div>';
    openSheet(room, (kind === 'in' ? 'チェックイン ' : 'チェックアウト ') + mdw(day), h);
    if (t && (t.photos || t.status === '完了')) loadPhotos(t.id, 'dPhotos');
    try {
      const r = await api('admin_history', { room });
      if (!cur || cur.room !== room) return;
      document.getElementById('dHist').innerHTML = r.items.length ? r.items.map(x => '<button data-act="histPhotos" data-v="' + x.id + '">' + mdw(x.doneAt.slice(0, 10)) + ' ' + hm(x.doneAt)
        + '<span>写真' + x.photos + '枚 ›</span></button>').join('') : '<div class="empty">まだありません</div>';
    } catch (e) { if (!e.silent) document.getElementById('dHist').innerHTML = '<div class="empty">読み込めませんでした</div>'; }
  }

  async function loadPhotos(id, target) {
    try {
      const r = await api('photos', { id });
      const el = document.getElementById(target); if (!el) return;
      el.dataset.urls = JSON.stringify(r.urls);
      el.innerHTML = r.urls.length ? r.urls.map((u, i) => '<button data-act="zoom" data-src="' + target + '" data-v="' + i + '"><img src="' + esc(u) + '" loading="lazy" alt=""></button>').join('')
                                   : '<div class="empty" style="grid-column:1/-1">写真はありません</div>';
    } catch (e) { if (!e.silent) { const el = document.getElementById(target); if (el) el.innerHTML = '<div class="empty" style="grid-column:1/-1">写真を読み込めませんでした</div>'; } }
  }
  function zoomFrom(urls, i) {
    lbUrls = urls; const st2 = document.getElementById('lbStrip');
    st2.innerHTML = urls.map(u => '<div><img src="' + esc(u) + '" alt=""></div>').join('');
    document.querySelector('.lbx .x').innerHTML = ICON_X;
    document.getElementById('lbx').classList.add('on'); st2.scrollLeft = st2.clientWidth * i;
    const cnt = () => document.getElementById('lbCount').textContent = (Math.round(st2.scrollLeft / st2.clientWidth) + 1) + ' / ' + urls.length;
    st2.onscroll = cnt; cnt();
  }
  async function histPhotos(id) {
    try { const r = await api('photos', { id }); if (r.urls.length) zoomFrom(r.urls, 0); else toast('写真はありません'); }
    catch (e) { if (!e.silent) toast('写真を読み込めませんでした', true); }
  }

  // ---------------------------------------------------------------- 確認（ブラウザ標準の confirm はサイト名が出て分かりにくい）
  function ask(q, yes) {
    return new Promise((ok) => {
      const el = document.getElementById('ask');
      document.getElementById('askQ').textContent = q; document.getElementById('askYes').textContent = yes;
      el.onclick = (e) => { if (e.target.id === 'askYes' || e.target.id === 'askNo' || e.target === el) { el.classList.remove('on'); el.onclick = null; ok(e.target.id === 'askYes'); } };
      el.classList.add('on');
    });
  }

  // ---------------------------------------------------------------- 操作
  async function doSet(op, value) {
    if (!cur || !cur.taskId) return;
    const labels = { complete: '完了にしました', undo: '取り消しました', cancel: '清掃不要にしました', restore: '元に戻しました', memo: 'メモを保存しました', due: '期限を保存しました' };
    if (op === 'undo' && !(await ask(cur.room + ' の完了を取り消しますか？\n（送った写真も外れます）', '取り消す'))) return;
    if (op === 'cancel' && !(await ask(cur.room + ' を清掃不要にしますか？\n（清掃会社の画面から消えます）', '清掃不要にする'))) return;
    try {
      await api('admin_set', { id: cur.taskId, op, value });
      toast(labels[op]);
      const keep = cur; await load(true);
      if (op !== 'memo' && op !== 'due') closeSheet(); else openDetail(keep.room, keep.day, keep.kind, keep.taskId);
    } catch (e) { if (!e.silent) toast('できませんでした：' + (e.message || ''), true); }
  }

  function addForm(room, day) {
    const opts = D.rooms.map(r => '<option' + (r === room ? ' selected' : '') + '>' + esc(r) + '</option>').join('');
    openSheet('臨時の清掃を追加', '清掃会社の画面に、その日の前日から出ます', '<div class="box">'
      + '<div class="lb">部屋</div><select id="aRoom">' + opts + '</select>'
      + '<div class="lb" style="margin-top:12px">清掃する日</div><input type="date" id="aDay" value="' + (day || D.today) + '">'
      + '<div class="lb" style="margin-top:12px">期限（任意）</div><input type="datetime-local" id="aDue">'
      + '<div class="lb" style="margin-top:12px">運営メモ（任意）</div><textarea id="aMemo" placeholder="例：シーツ交換のみ"></textarea>'
      + '<div class="btns" style="margin-top:12px"><button class="btn pri full" data-act="addSave">追加する</button></div></div>');
  }
  async function addSave() {
    const room = document.getElementById('aRoom').value, day = document.getElementById('aDay').value, due = document.getElementById('aDue').value, memo = document.getElementById('aMemo').value.trim();
    if (!day) { toast('清掃する日を選んでください', true); return; }
    try { await api('admin_add', { room, day, due, memo }); toast('追加しました'); closeSheet(); load(true); }
    catch (e) { if (!e.silent) toast('できませんでした：' + (e.message || ''), true); }
  }

  // ---------------------------------------------------------------- 読み込み
  async function load(quiet) {
    if (!getPass()) { askPass(); return; }
    const ds = days();
    try {
      D = await api('admin_data', { from: ds[0], to: ds[6] });
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(D)); } catch (e) {}
      render();
    } catch (e) {
      if (e.silent) return;
      if (!D) document.getElementById('view').innerHTML = '<div class="empty">読み込めませんでした。電波の良い所で開き直してください</div>';
      if (!quiet) toast('読み込めませんでした：' + (e.message || ''), true);
    }
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('#ask')) return;
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act, v = b.dataset.v;
    if (a === 'week') { weekOff = v === '0' ? 0 : weekOff + Number(v); selDay = ''; render(); load(true); }
    else if (a === 'tab') { tab = v; render(); }
    else if (a === 'day') { selDay = v; render(); }
    else if (a === 'open') openDetail(b.dataset.room, b.dataset.day, b.dataset.kind);
    else if (a === 'task') { const t = T().find(x => x.id === v); if (t) openDetail(t.room, (t.due || '').slice(0, 10) || t.day, 'in', t.id); }
    else if (a === 'close') closeSheet();
    else if (a === 'closeLb') document.getElementById('lbx').classList.remove('on');
    else if (a === 'zoom') zoomFrom(JSON.parse(document.getElementById(b.dataset.src).dataset.urls || '[]'), Number(v));
    else if (a === 'histPhotos') histPhotos(v);
    else if (a === 'op') doSet(v);
    else if (a === 'memo') doSet('memo', document.getElementById('dMemo').value.trim());
    else if (a === 'due') { const x = document.getElementById('dDue').value; if (!x) { toast('期限を選んでください', true); return; } doSet('due', x); }
    else if (a === 'add') addForm(b.dataset.room, b.dataset.day);
    else if (a === 'addSave') addSave();
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
  setInterval(() => { if (!document.hidden) load(true); }, 120000);
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.today === jstToday()) { D = c; render(); } } catch (e) {}
  load();
</script>
</body>
</html>
