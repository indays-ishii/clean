<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="清掃">
<meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121312" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>清掃</title>
<!--
  OCHAHOUSE 清掃会社用「清掃」（GitHub Pages: indays-ishii/clean）
  ishiiさん決定 2026-09-26：機能は完了報告だけ。デザインとシンプルさを磨く。
  まだ完了していない部屋を期限（＝次のゲストのチェックイン）の早い順にすべて出す。明日OUTの部屋も前日昼から出て、ボタンはいつでも押せる。
  使い方：部屋を押す → 写真をまとめて選ぶ（1回15枚ほど）→ 1枚ずつ送信 → 全部届いたら自動で完了。
  電波が切れても写真はこの端末に残り、つながったら続きから自動で送る。
  データの読み書きは Google Apps Script（ishii@indays.jp）の受け口 API_URL。合言葉はこのページに書かない。
-->
<style>
  :root {
    --bg: #f5f5f2; --card: #ffffff; --ink: #161816; --sub: #767a73; --line: #e6e7e2;
    --red: #d23f28; --green: #2c8a4a; --green-bg: #e9f4ec; --amber-bg: #fff4d9; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121312; --card: #1d1f1d; --ink: #f1f2ee; --sub: #9a9e97; --line: #2c2f2c;
      --red: #ff6b52; --green: #5cc57c; --green-bg: #173021; --amber-bg: #3a3017; --shadow: none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 520px; margin: 0 auto;
    padding: calc(28px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom)); }

  header { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 20px; }
  h1 { font-size: 30px; font-weight: 800; margin: 0; letter-spacing: .01em; }
  .sub { color: var(--sub); font-size: 15px; margin-top: 4px; }
  .left { font-size: 15px; color: var(--sub); white-space: nowrap; }
  .left b { font-size: 26px; color: var(--ink); font-weight: 800; margin: 0 2px; }

  .room { position: relative; width: 100%; display: block; text-align: left; border: 0; font: inherit; color: inherit;
    background: var(--card); border-radius: 22px; padding: 22px 22px 20px; margin-bottom: 14px;
    box-shadow: var(--shadow); overflow: hidden; }
  .room:active { transform: scale(.985); }
  .room .name { font-size: 30px; font-weight: 800; letter-spacing: .01em; line-height: 1.15; }
  .room .when { margin-top: 8px; font-size: 17px; color: var(--sub); font-weight: 600; }
  .room.early .when { color: var(--red); }
  .room .note { margin-top: 12px; font-size: 15px; line-height: 1.45; background: var(--amber-bg);
    border-radius: 12px; padding: 10px 12px; }
  .room .cta { margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 56px; border-radius: 16px; background: var(--ink); color: var(--bg); font-size: 18px; font-weight: 700; }
  .room.early .cta { background: var(--red); color: #fff; }
  .room .out { margin-top: 4px; font-size: 14px; color: var(--sub); }
  .tag { display: inline-block; vertical-align: middle; margin-left: 8px; font-size: 13px; font-weight: 700;
    color: #fff; background: var(--red); border-radius: 8px; padding: 3px 8px; }

  /* 送信中・未送信 */
  .room.sending .cta, .room.waiting .cta { background: var(--line); color: var(--ink); }
  .bar { height: 8px; border-radius: 8px; background: var(--line); margin-top: 18px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 8px; transition: width .3s; }
  .prog { display: flex; justify-content: space-between; margin-top: 10px; font-size: 15px; color: var(--sub); font-weight: 600; }
  .room.waiting .prog { color: var(--red); }

  .donehead { margin: 30px 6px 10px; font-size: 14px; color: var(--sub); font-weight: 700; }
  .done { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; font: inherit; color: inherit; text-align: left;
    background: var(--green-bg); border-radius: 16px; padding: 15px 18px; margin-bottom: 8px; }
  .done .ok { width: 28px; height: 28px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center;
    font-size: 16px; font-weight: 800; flex: none; }
  .done .n { font-size: 18px; font-weight: 800; }
  .done .m { font-size: 13px; color: var(--sub); margin-top: 2px; }

  .empty { text-align: center; margin-top: 90px; color: var(--sub); font-size: 17px; line-height: 1.8; }
  .empty .big { font-size: 44px; }
  .hint { text-align: center; color: var(--sub); font-size: 13px; margin-top: 26px; }

  .veil { position: fixed; inset: 0; background: rgba(10,12,10,.5); display: none; align-items: center; justify-content: center;
    z-index: 10; padding: 20px; }
  .veil.on { display: flex; }
  .box { background: var(--card); color: var(--ink); border-radius: 24px; padding: 28px 22px 22px; width: min(92vw, 400px); text-align: center; }
  .box .t { font-size: 22px; font-weight: 800; }
  .box .s { color: var(--sub); margin-top: 6px; }
  .box input { width: 100%; font-size: 22px; padding: 15px; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--bg); color: var(--ink); margin: 18px 0 8px; text-align: center; }
  .box .err { color: var(--red); font-size: 15px; min-height: 1.5em; }
  .box .go { width: 100%; height: 56px; font-size: 18px; font-weight: 800; color: var(--bg); background: var(--ink);
    border: 0; border-radius: 16px; margin-top: 6px; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(20px); bottom: calc(24px + env(safe-area-inset-bottom));
    background: var(--green); color: #fff; padding: 14px 20px; border-radius: 999px; font-size: 16px; font-weight: 700;
    opacity: 0; transition: .25s; z-index: 20; white-space: nowrap; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.bad { background: var(--red); }

  /* 表示以外の施設 */
  .othersBtn { display: block; width: 100%; margin: 26px 0 0; height: 50px; border-radius: 14px; border: 1.5px solid var(--line);
    background: transparent; color: var(--sub); font: inherit; font-size: 16px; font-weight: 700; }
  .others { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .other { height: 58px; border-radius: 14px; border: 0; background: var(--card); color: var(--ink); box-shadow: var(--shadow);
    font: inherit; font-size: 17px; font-weight: 800; }
  .other:active { transform: scale(.97); }
  .othersNote { grid-column: 1 / -1; color: var(--sub); font-size: 13px; text-align: center; margin-bottom: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>清掃</h1><div class="sub" id="date">&nbsp;</div></div>
    <div class="left" id="left"></div>
  </header>
  <div id="list"></div>
  <div class="hint" id="hint"></div>
</main>

<input type="file" id="pick" accept="image/*" multiple hidden>

<div class="veil" id="passVeil">
  <form class="box" onsubmit="savePass(event)">
    <div class="t">合言葉を入れてください</div>
    <div class="s">最初の1回だけです</div>
    <input id="passInput" autocomplete="off" autocapitalize="off" enterkeyhint="go">
    <div class="err" id="passErr"></div>
    <button class="go" type="submit">はじめる</button>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
  // 画面が止まったときに原因が分かるよう、エラーを下に小さく出す
  function showErr(m) { const h = document.getElementById('hint'); if (h) h.textContent = '（エラー：' + m + '）'; }
  window.addEventListener('error', (e) => showErr(e.message));
  window.addEventListener('unhandledrejection', (e) => showErr((e.reason && e.reason.message) || String(e.reason)));
  const API_URL = 'https://script.google.com/macros/s/AKfycbwbjt-hp9B4waGGvv1rmac6oKwZX6iJJI0cXQGhtfZz7ZKwDJT1rOxgtv2eiigKFYoDJw/exec';
  const PASS_KEY = 'ochahouse-clean-pass';
  const MAX_SIDE = 1024, QUALITY = 0.5;          // 画質は低くてよい（ishiiさん 2026-09-26）。軽いほど速く送れる
  const PER_REQ = 3, PARALLEL = 2;               // 3枚ずつまとめて、2本同時に送る（1枚ずつより数倍速い）
  const UPLOAD_TTL = 50 * 60 * 1000;             // Notionに預けた写真は1時間で消えるので、50分を過ぎたら送り直す
  const WD = '日月火水木金土';
  let tasks = [], rooms = [], today = '', picking = null, running = false, passAsked = false, showOthers = false;

  // ---------------------------------------------------------------- 合言葉
  function getPass() { try { return localStorage.getItem(PASS_KEY) || ''; } catch (e) { return window._pass || ''; } }
  function setPass(v) { window._pass = v; try { v ? localStorage.setItem(PASS_KEY, v) : localStorage.removeItem(PASS_KEY); } catch (e) {} }
  function askPass(msg) {
    passAsked = true;
    document.getElementById('passErr').textContent = msg || '';
    document.getElementById('passVeil').classList.add('on');
    setTimeout(() => document.getElementById('passInput').focus(), 60);
  }
  function savePass(ev) {
    ev.preventDefault();
    const v = document.getElementById('passInput').value.trim();
    if (!v) return;
    setPass(v); passAsked = false;
    document.getElementById('passVeil').classList.remove('on');
    load(); pump();
  }

  // ---------------------------------------------------------------- 受け口
  async function api(action, extra) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ pass: getPass(), action: action }, extra || {})) });
    const j = await res.json();
    if (!j.ok && j.error === 'passcode') { setPass(''); askPass('合言葉がちがいます'); throw { silent: true }; }
    if (!j.ok) throw new Error(j.error || 'エラー');
    return j.data;
  }

  // ---------------------------------------------------------------- 送信待ちの保管（この端末の IndexedDB）
  // iPhoneのSafariやLINEの中のブラウザでは IndexedDB が開けない・返事が来ないことがある。
  // その時はこの画面を開いている間だけの保管に切り替え、一覧の表示は止めない。
  const mem = new Map();
  let dbp = null;
  function db() {
    if (!dbp) dbp = new Promise((ok) => {
      const t = setTimeout(() => ok(null), 1500);
      try {
        const r = indexedDB.open('ochahouse-clean', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('jobs', { keyPath: 'id' });
        r.onsuccess = () => { clearTimeout(t); ok(r.result); };
        r.onerror = r.onblocked = () => { clearTimeout(t); ok(null); };
      } catch (e) { clearTimeout(t); ok(null); }
    });
    return dbp;
  }
  function tx(mode, fn, fallback) {
    return db().then((d) => new Promise((ok) => {
      if (!d) return ok(fallback());
      try {
        const t = d.transaction('jobs', mode), st = t.objectStore('jobs'), q = fn(st);
        t.oncomplete = () => ok(q && q.result !== undefined ? q.result : undefined);
        t.onerror = t.onabort = () => ok(fallback());
      } catch (e) { ok(fallback()); }
    }));
  }
  async function jobs() { return (await tx('readonly', st => st.getAll(), () => Array.from(mem.values()))) || []; }
  function putJob(j) { mem.set(j.id, j); return tx('readwrite', st => { st.put(j); }, () => {}); }
  function delJob(id) { mem.delete(id); return tx('readwrite', st => { st.delete(id); }, () => {}); }

  // ---------------------------------------------------------------- 画面
  function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function hm(iso) { const m = /T([0-9][0-9]:[0-9][0-9])/.exec(iso || ''); return m ? m[1] : ''; }
  function toast(msg, bad) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast on' + (bad ? ' bad' : '');
    clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast' + (bad ? ' bad' : ''), bad ? 5000 : 2600);
  }

  // 期限の見せ方：今日 16:00まで／明日 15:00まで／9/29（火）16:00まで。今日が期限か過ぎていれば赤
  function md(ymd) {
    const d = new Date(ymd + 'T00:00:00+09:00');
    return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）';
  }
  function rel(ymd) {
    if (ymd === today) return '今日';
    const d = new Date(ymd + 'T00:00:00+09:00'), t = new Date(today + 'T00:00:00+09:00');
    const n = Math.round((d - t) / 86400000);
    if (n === 1) return '明日';
    if (n === -1) return '昨日';
    return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）';
  }
  function when(t) {
    if (!t.due) return { text: '次の予約なし', hot: false };
    const day = t.due.slice(0, 10), early = /アーリー/.test(t.deadline);
    const over = new Date(t.due) < new Date();
    const text = rel(day) + ' ' + hm(t.due) + 'まで' + (early ? '（アーリー）' : '') + (over ? '・過ぎています' : '');
    return { text: text, hot: over || day <= today };
  }

  function progressCard(j, name, hot) {
    const sent = j.uploads.filter(Boolean).length, all = j.photos.length || 1;
    const waiting = j.state === 'waiting';
    return '<div class="room ' + (waiting ? 'waiting' : 'sending') + (hot ? ' early' : '') + '">' + name
      + '<div class="bar"><i style="width:' + Math.round(sent / all * 100) + '%"></i></div>'
      + '<div class="prog"><span>' + (waiting ? '電波が戻ったら自動で送ります' : j.state === 'preparing' ? '写真を準備しています' : sent === all ? '完了にしています…' : '写真を送っています') + '</span><span>'
      + sent + ' / ' + j.photos.length + '枚</span></div></div>';
  }

  async function render() {
    const js = {}; (await jobs()).forEach(j => js[j.id] = j);
    if (today) {
      const d = new Date(today + 'T00:00:00+09:00');
      document.getElementById('date').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）';
    }
    const todo = tasks.filter(t => !t.done), done = tasks.filter(t => t.done);
    document.getElementById('left').innerHTML = todo.length ? 'あと<b>' + todo.length + '</b>部屋' : '';
    let h = '';
    // 表示以外の施設で送信中の部屋
    Object.values(js).filter(j => j.id.indexOf('room:') === 0).forEach(j => {
      h += progressCard(j, '<div class="name">' + esc(j.room) + '</div><div class="when">一覧外の清掃</div>', false);
    });
    if (today && !todo.length && !h) h = '<div class="empty"><div class="big">' + (done.length ? '✨' : '🌿') + '</div>清掃待ちの部屋はありません'
      + (done.length ? '<br>おつかれさまでした' : '') + '</div>';
    todo.forEach(t => {
      const w = when(t);
      const j = js[t.id];
      const name = '<div class="name">' + esc(t.room.replace(/^（見本）/, '')) + '</div>'
        + '<div class="when">' + esc(w.text) + '</div>'
        + (t.day > today ? '<div class="out">' + rel(t.day) + (rel(t.day) === md(t.day) ? '' : ' ' + md(t.day)) + (t.out ? ' ' + t.out : '') + ' チェックアウト後</div>' : '')
        + (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '');
      const early = w.hot;
      if (j) {
        h += progressCard(j, name, early);
      } else {
        h += '<button class="room' + (early ? ' early' : '') + '" data-act="pick" data-id="' + t.id + '">' + name
          + '<div class="cta">📷 写真を選んで完了</div></button>';
      }
    });
    if (done.length) h += '<div class="donehead">完了</div>';
    done.forEach(t => {
      h += '<button class="done" data-act="undo" data-id="' + t.id + '"><div class="ok">✓</div><div><div class="n">'
        + esc(t.room.replace(/^（見本）/, '')) + '</div><div class="m">' + hm(t.doneAt) + ' 完了・写真' + (t.photos || 0) + '枚</div></div></button>';
    });
    if (today) {
      const busy = new Set(todo.map(t => t.room).concat(Object.values(js).map(j => j.room)));
      const rest = rooms.filter(r => !busy.has(r));
      h += '<button class="othersBtn" data-act="others">' + (showOthers ? '閉じる' : '表示以外の施設') + '</button>';
      if (showOthers) {
        h += '<div class="others"><div class="othersNote">一覧にない部屋を掃除したときはここから</div>'
          + rest.map(r => '<button class="other" data-act="pick" data-id="room:' + esc(r) + '">' + esc(r) + '</button>').join('') + '</div>';
      }
    }
    document.getElementById('list').innerHTML = h;
    document.getElementById('hint').textContent = todo.length ? '清掃中はふだんのカメラで撮っておき、終わったら部屋を押して写真をまとめて選んでください' : '';
  }

  async function load() {
    if (!getPass()) { askPass(); return; }
    try { const d = await api('list'); tasks = d.tasks; today = d.today; rooms = d.rooms || rooms; render(); }
    catch (e) {
      if (e.silent) return;
      if (!tasks.length) document.getElementById('list').innerHTML = '<div class="empty">読み込めませんでした<br>電波の良い所で開き直してください</div>';
      showErr(e.message || String(e));
    }
  }

  // ---------------------------------------------------------------- 写真を選ぶ → 縮める → 保管
  function pick(id) { picking = id; const p = document.getElementById('pick'); p.value = ''; p.click(); }

  function shrink(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', QUALITY).split(',')[1]);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('写真を読み込めませんでした')); };
      img.src = url;
    });
  }

  document.getElementById('pick').addEventListener('change', async (ev) => {
    const files = Array.from(ev.target.files || []);
    const id = picking; picking = null;
    if (!files.length || !id) return;
    const t = tasks.find(x => x.id === id);
    if (id.indexOf('room:') === 0) showOthers = false;
    const job = { id: id, room: t ? t.room : id.replace(/^room:/, ''), photos: [], uploads: [], at: [], state: 'preparing', created: Date.now() };
    await putJob(job); render();
    for (const f of files) {
      try { job.photos.push(await shrink(f)); } catch (e) { /* 読めない写真は飛ばす */ }
      job.uploads.push(null); job.at.push(0);
      await putJob(job); render();
    }
    if (!job.photos.length) { await delJob(id); render(); toast('写真を読み込めませんでした。もう一度選んでください', true); return; }
    job.state = 'sending'; await putJob(job);
    pump();
  });

  // ---------------------------------------------------------------- 送信（1枚ずつ。失敗しても保管したまま、あとで続きから）
  async function pump() {
    if (running || !getPass()) return;
    running = true;
    try {
      for (const job of await jobs()) {
        if (job.state === 'preparing' && Date.now() - job.created < 5 * 60 * 1000) continue;  // まだ写真を縮めている途中
        job.state = 'sending'; await putJob(job); render();
        try {
          // まだ届いていない写真を PER_REQ 枚ずつに分け、PARALLEL 本ずつ同時に送る
          const todoIdx = job.photos.map((_, i) => i).filter(i => !(job.uploads[i] && Date.now() - job.at[i] < UPLOAD_TTL));
          const chunks = [];
          for (let k = 0; k < todoIdx.length; k += PER_REQ) chunks.push(todoIdx.slice(k, k + PER_REQ));
          const worker = async () => {
            for (let c = chunks.shift(); c; c = chunks.shift()) {
              const r = await api('uploads', { files: c.map(i => ({ b64: job.photos[i], filename: 'photo' + (i + 1) + '.jpg' })) });
              c.forEach((i, n) => { job.uploads[i] = r.uploads[n]; job.at[i] = Date.now(); });
              await putJob(job); render();
            }
          };
          await Promise.all(Array.from({ length: PARALLEL }, worker));
          const room = job.id.indexOf('room:') === 0 ? job.id.slice(5) : '';
          const d = await api('complete', room ? { room: room, uploads: job.uploads.filter(Boolean) }
                                               : { id: job.id, uploads: job.uploads.filter(Boolean) });
          await delJob(job.id);
          tasks = d.tasks; today = d.today; rooms = d.rooms || rooms; render();
          toast('✓ ' + job.room.replace(/^（見本）/, '') + ' 完了しました');
        } catch (e) {
          if (e && e.silent) break;
          job.state = 'waiting'; await putJob(job); render();
        }
      }
    } finally { running = false; }
  }

  // ---------------------------------------------------------------- 取り消し
  async function undo(id) {
    const t = tasks.find(x => x.id === id);
    if (!t || !confirm(t.room.replace(/^（見本）/, '') + ' の完了を取り消しますか？')) return;
    try { const d = await api('undo', { id: id }); tasks = d.tasks; today = d.today; render(); toast('取り消しました'); }
    catch (e) { if (!e.silent) toast('取り消せませんでした。もう一度押してください', true); }
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    ({ pick: pick, undo: undo, others: () => { showOthers = !showOthers; render(); } })[b.dataset.act](b.dataset.id);
  });
  window.addEventListener('online', pump);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); pump(); } });
  setInterval(() => { if (!document.hidden && !passAsked) { load(); pump(); } }, 60000);
  load(); pump();
</script>
</body>
</html>
