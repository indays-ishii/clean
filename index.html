<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="今日の清掃">
<meta name="theme-color" content="#1d1f1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>今日の清掃</title>
<!--
  OCHAHOUSE 清掃会社用「今日の清掃」画面（GitHub Pages: indays-ishii/clean）
  データの読み書きは Google Apps Script（ishii@indays.jp）の受け口 API_URL が行う。
  合言葉は最初の1回だけ入力し、この端末に保存する。合言葉そのものはこのページに書かない。
-->
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --ink: #1d1f1c; --sub: #6b6f68;
    --todo: #1d1f1c; --early: #d64027; --done: #2f8a4b; --line: #e3e5df;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 16px 48px; }
  header { margin-bottom: 16px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: .02em; }
  .date { color: var(--sub); font-size: 16px; }

  .room { width: 100%; display: block; text-align: left; border: 0; border-radius: 18px;
    background: var(--card); padding: 20px 20px 18px; margin-bottom: 14px; color: var(--ink); font: inherit;
    box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(0,0,0,.05); border-left: 10px solid var(--todo); }
  .room.early { border-left-color: var(--early); }
  .room .name { font-size: 28px; font-weight: 700; }
  .room .when { font-size: 18px; margin-top: 6px; color: var(--sub); }
  .room.early .when { color: var(--early); font-weight: 700; }
  .room .note { font-size: 15px; margin-top: 8px; background: #fff6e0; border-radius: 10px; padding: 8px 10px; }
  .room .cta { margin-top: 14px; font-size: 18px; font-weight: 700; color: #fff; background: var(--ink);
    border-radius: 12px; padding: 14px; text-align: center; }
  .room.early .cta { background: var(--early); }
  .room .old { display: inline-block; font-size: 13px; color: #fff; background: var(--early);
    border-radius: 6px; padding: 2px 8px; margin-left: 8px; vertical-align: middle; }
  .nophoto { display: block; margin: -6px 0 18px auto; background: none; border: 0; color: var(--sub);
    font-size: 14px; text-decoration: underline; padding: 6px 4px; }

  .done { border-radius: 16px; background: #e8f3ea; padding: 14px 18px; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .done .name { font-size: 20px; font-weight: 700; color: var(--done); }
  .done .meta { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .done .acts { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .done button { background: none; border: 0; color: var(--sub); font-size: 13px; text-decoration: underline; padding: 2px; }
  .section { font-size: 14px; color: var(--sub); margin: 22px 4px 10px; }

  .empty { text-align: center; color: var(--sub); font-size: 18px; margin-top: 60px; }
  .refresh { display: block; margin: 24px auto 0; background: none; border: 1px solid var(--line);
    border-radius: 999px; padding: 10px 22px; font-size: 15px; color: var(--sub); }

  .veil { position: fixed; inset: 0; background: rgba(20,22,20,.55); display: none;
    align-items: center; justify-content: center; z-index: 10; }
  .veil.on { display: flex; }
  .box { background: #fff; border-radius: 20px; padding: 26px 22px; width: min(88vw, 420px); text-align: center; }
  .box .big { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  .box input { width: 100%; font-size: 22px; padding: 14px; border-radius: 12px; border: 1px solid var(--line);
    margin: 14px 0; text-align: center; }
  .box .go { width: 100%; font-size: 19px; font-weight: 700; color: #fff; background: var(--ink);
    border: 0; border-radius: 12px; padding: 14px; }
  .box .err { color: var(--early); font-size: 15px; min-height: 1.4em; }
  .spin { width: 42px; height: 42px; border: 4px solid #ddd; border-top-color: var(--done); border-radius: 50%;
    margin: 0 auto 14px; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom));
    background: var(--early); color: #fff; padding: 14px 16px; border-radius: 14px; font-size: 16px; display: none; z-index: 20; }
  .toast.ok { background: var(--done); }
</style>
</head>
<body>
<main>
  <header><h1>今日の清掃</h1><div class="date" id="date"></div></header>
  <div id="list"><div class="empty">読み込み中…</div></div>
  <button class="refresh" onclick="load()">↻ 更新</button>
</main>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<div class="veil" id="passVeil">
  <form class="box" onsubmit="savePass(event)">
    <div class="big">合言葉を入れてください</div>
    <div style="color:#6b6f68">最初の1回だけです</div>
    <input id="passInput" autocomplete="off" autocapitalize="off" enterkeyhint="go">
    <div class="err" id="passErr"></div>
    <button class="go" type="submit">はじめる</button>
  </form>
</div>
<div class="veil" id="busy"><div class="box"><div class="spin"></div><div class="big" id="busyText">送信中…</div></div></div>
<div class="toast" id="toast"></div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwbjt-hp9B4waGGvv1rmac6oKwZX6iJJI0cXQGhtfZz7ZKwDJT1rOxgtv2eiigKFYoDJw/exec';
  const PASS_KEY = 'ochahouse-clean-pass';
  const WD = '日月火水木金土';
  let current = null;   // 写真を撮っている部屋
  let tasks = [];

  function getPass() { try { return localStorage.getItem(PASS_KEY) || ''; } catch (e) { return window._pass || ''; } }
  function setPass(v) { window._pass = v; try { v ? localStorage.setItem(PASS_KEY, v) : localStorage.removeItem(PASS_KEY); } catch (e) {} }

  function askPass(msg) {
    document.getElementById('passErr').textContent = msg || '';
    document.getElementById('passVeil').classList.add('on');
    setTimeout(() => document.getElementById('passInput').focus(), 50);
  }
  function savePass(ev) {
    ev.preventDefault();
    const v = document.getElementById('passInput').value.trim();
    if (!v) return;
    setPass(v);
    document.getElementById('passVeil').classList.remove('on');
    load();
  }

  // 受け口（Apps Script）を呼ぶ。Content-Type を付けない＝単純なリクエストにして、別サイトからでも呼べるようにする
  async function api(action, extra) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ pass: getPass(), action: action }, extra || {})) });
    const j = await res.json();
    if (!j.ok && j.error === 'passcode') { setPass(''); busy(false); askPass('合言葉がちがいます'); throw { silent: true }; }
    if (!j.ok) throw new Error(j.error || '送信に失敗しました');
    return j.data;
  }

  function busy(on, text) {
    document.getElementById('busyText').textContent = text || '送信中…';
    document.getElementById('busy').classList.toggle('on', on);
  }
  function toast(msg, ok) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast' + (ok ? ' ok' : ''); t.style.display = 'block';
    clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', ok ? 2500 : 6000);
  }
  function fail(e) {
    busy(false);
    if (e && e.silent) return;
    toast('うまく送れませんでした。電波の良い所でもう一度押してください（' + (e && e.message || e) + '）');
  }
  function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function hm(iso) { const m = /T([0-9][0-9]:[0-9][0-9])/.exec(iso || ''); return m ? m[1] : ''; }

  function render(data) {
    tasks = data.tasks;
    const d = new Date(data.today + 'T00:00:00+09:00');
    document.getElementById('date').textContent = (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）';
    const todo = tasks.filter(t => !t.done), done = tasks.filter(t => t.done);
    let h = '';
    if (!tasks.length) h = '<div class="empty">今日の清掃はありません</div>';
    todo.forEach(t => {
      const early = /⚠️|アーリー/.test(t.deadline);
      h += '<button class="room' + (early ? ' early' : '') + '" data-act="shoot" data-id="' + t.id + '">'
        + '<div class="name">' + esc(t.room) + (t.old ? '<span class="old">昨日の分</span>' : '') + '</div>'
        + (t.deadline ? '<div class="when">' + esc(t.deadline) + '</div>' : '')
        + (t.note ? '<div class="note">' + esc(t.note) + '</div>' : '')
        + '<div class="cta">📷 写真を撮って完了</div></button>'
        + '<button class="nophoto" data-act="nophoto" data-id="' + t.id + '">写真なしで完了</button>';
    });
    if (done.length) h += '<div class="section">完了した部屋</div>';
    done.forEach(t => {
      h += '<div class="done"><div><div class="name">✅ ' + esc(t.room) + '</div>'
        + '<div class="meta">' + hm(t.doneAt) + ' 完了' + (t.photos ? '・📷' : '・写真なし') + '</div></div>'
        + '<div class="acts"><button data-act="shoot" data-id="' + t.id + '">写真を追加</button>'
        + '<button data-act="undo" data-id="' + t.id + '">取り消す</button></div></div>';
    });
    document.getElementById('list').innerHTML = h;
  }

  function load() {
    if (!getPass()) { askPass(); return; }
    api('list').then(render).catch(fail);
  }

  function roomName(id) { const t = tasks.find(x => x.id === id); return t ? t.room : ''; }
  function shoot(id) { current = id; const c = document.getElementById('cam'); c.value = ''; c.click(); }

  // 撮った写真を小さくしてから送る（通信量と待ち時間を減らす）
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
      };
      img.onerror = reject; img.src = url;
    });
  }

  document.getElementById('cam').addEventListener('change', async (ev) => {
    const files = Array.from(ev.target.files || []);
    if (!files.length || !current) return;
    const id = current, name = roomName(id);
    busy(true, name + ' を送信中…');
    try {
      const photos = [];
      for (let i = 0; i < files.length; i++) {
        photos.push({ b64: await shrink(files[i]), mime: 'image/jpeg', filename: 'photo' + (i + 1) + '.jpg' });
      }
      render(await api('report', { id: id, photos: photos }));
      busy(false); toast(name + ' 完了しました', true);
    } catch (e) { fail(e); }
  });

  async function noPhoto(id) {
    const name = roomName(id);
    if (!confirm(name + ' を写真なしで完了にしますか？')) return;
    busy(true, name + ' を送信中…');
    try { render(await api('report', { id: id, photos: [] })); busy(false); toast(name + ' 完了しました', true); }
    catch (e) { fail(e); }
  }

  async function undo(id) {
    const name = roomName(id);
    if (!confirm(name + ' の完了を取り消しますか？')) return;
    busy(true, '取り消し中…');
    try { render(await api('undo', { id: id })); busy(false); toast(name + ' を未完了に戻しました', true); }
    catch (e) { fail(e); }
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    ({ shoot: shoot, nophoto: noPhoto, undo: undo })[b.dataset.act](b.dataset.id);
  });
  load();
  setInterval(() => {
    const blocked = document.getElementById('busy').classList.contains('on') || document.getElementById('passVeil').classList.contains('on');
    if (!document.hidden && !blocked) load();
  }, 60000);
</script>
</body>
</html>
