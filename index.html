<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="清掃">
<meta name="theme-color" content="#f6f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121411" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>清掃</title>
<!--
  OCHAHOUSE 清掃会社用「清掃」（GitHub Pages: indays-ishii/clean）
  ishiiさん決定 2026-09-26：機能は完了報告だけ。デザインとシンプルさを磨く。
  まだ完了していない部屋を期限（＝次のゲストのチェックイン）の早い順にすべて出す。明日OUTの部屋も前日昼から出て、ボタンはいつでも押せる。
  使い方：部屋を押す → 写真をまとめて選ぶ（1回15枚ほど）→ 1枚ずつ送信 → 全部届いたら自動で完了。
  電波が切れても写真はこの端末に残り、つながったら続きから自動で送る。
  データの読み書きは Cloudflare Workers の受け口 API_URL（ochahouse-ops/cleaning-worker）。合言葉はこのページに書かない。
-->
<style>
  /* デザイン：K案（日付ごとの時間軸）＋今日の達成度リング。抹茶色は「押すところ」、赤は「今日締切」だけ（ishiiさん 2026-09-26） */
  :root {
    --bg: #f6f6f2; --card: #ffffff; --ink: #1d1f1b; --sub: #6d7169; --muted: #a4a79f; --line: #e6e7e1; --line2: #d5d7cf;
    --matcha: #5b8e3e; --matcha-ink: #3f6a28; --matcha-bg: #edf3e6;
    --red: #c4442c; --red-line: #eeb8ab; --red-bg: #fcefeb; --amber: #8a6512; --amber-bg: #fbf3df;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121411; --card: #1b1d1a; --ink: #eef0ea; --sub: #a1a59c; --muted: #6c7068; --line: #2a2d28; --line2: #3a3e37;
      --matcha: #7fb65c; --matcha-ink: #a9d68a; --matcha-bg: #1f2c18;
      --red: #ff7a5e; --red-line: #6e2f23; --red-bg: #2f1a15; --amber: #e0b85a; --amber-bg: #2c2512; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 520px; margin: 0 auto;
    padding: calc(22px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }

  /* 見出し＋リング */
  header { display: flex; align-items: center; gap: 14px; margin: 4px 2px 22px; }
  .ring { width: 62px; height: 62px; flex: none; }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .track { stroke: var(--line); }
  .ring .val { stroke: var(--matcha); stroke-linecap: round; transition: stroke-dasharray .6s cubic-bezier(.2,.8,.2,1); }
  .ring text { fill: var(--ink); font-size: 15px; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
  h1 { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: .02em; }
  .sub { color: var(--sub); font-size: 13px; margin-top: 3px; }
  #sync { color: var(--muted); }

  /* 時間軸 */
  .tl { position: relative; padding-left: 26px; }
  .tl::before { content: ""; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 2px; background: var(--line); border-radius: 2px; }
  .day { position: relative; margin-bottom: 20px; }
  .dot { position: absolute; left: -26px; top: 2px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--matcha); }
  .day.hot .dot { background: var(--red); border-color: var(--red); }
  .day.none .dot { border-color: var(--line2); }
  .dl { font-size: 13px; font-weight: 600; margin: 0 0 7px 2px; color: var(--ink); }
  .day.hot .dl { color: var(--red); }
  .day.none .dl { color: var(--sub); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .day.hot .card { border-color: var(--red-line); }

  .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 12px 13px 14px; border: 0; background: none;
    text-align: left; transition: background .15s; }
  .row + .row { border-top: 1px solid var(--line); }
  div.row[data-act] { cursor: pointer; }
  div.row[data-act]:active { background: var(--matcha-bg); }
  button.cam { border: 0; padding: 0; }
  button.cam:active { transform: scale(.92); }

  /* 部屋の画面（入室方法） */
  .rbody { flex: 1; overflow-y: auto; padding: 14px 16px 12px; }
  .rsec { font-size: 12px; font-weight: 700; color: var(--sub); margin: 4px 2px 8px; }
  .key { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .key .kind { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--matcha-bg); color: var(--matcha-ink); }
  .key.spare .kind { background: var(--line); color: var(--sub); }
  .key .warnTag { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--red-bg); color: var(--red); margin-left: 6px; }
  .key .place { font-size: 14px; margin-top: 8px; line-height: 1.5; }
  .key .code { display: flex; gap: 18px; margin-top: 8px; }
  .key .code div { font-size: 11px; color: var(--sub); }
  .key .code b { display: block; font-size: 26px; color: var(--ink); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
  .key .knote { font-size: 12px; color: var(--sub); margin-top: 6px; line-height: 1.5; }
  .rfoot { padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .bigBtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 56px; border: 0; border-radius: 16px;
    background: var(--matcha); color: #fff; font-size: 17px; font-weight: 700; }
  .bigBtn svg { width: 22px; height: 22px; }
  .tm { width: 46px; flex: none; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  .day.hot .tm { color: var(--red); }
  .day.none .tm { color: var(--muted); }
  .nm { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .nm small { display: block; font-size: 12px; font-weight: 400; color: var(--sub); margin-top: 2px; }
  .nm small.warn { color: var(--red); }
  .nm .note { display: block; font-size: 12px; font-weight: 400; color: var(--amber); background: var(--amber-bg);
    border-radius: 8px; padding: 5px 8px; margin-top: 6px; line-height: 1.45; }
  .cam { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--matcha); color: #fff;
    display: flex; align-items: center; justify-content: center; }
  .cam svg { width: 20px; height: 20px; }
  .mini { width: 40px; height: 40px; flex: none; }
  .mini circle { fill: none; stroke-width: 4; }
  .mini .track { stroke: var(--line); }
  .mini .val { stroke: var(--matcha); stroke-linecap: round; transition: stroke-dasharray .3s; }
  .mini.wait .val { stroke: var(--red); }
  .mini text { font-size: 10px; font-weight: 600; fill: var(--sub); }

  /* 今日完了 */
  .doneBox { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
  .cap { font-size: 12px; color: var(--sub); margin: 0 0 4px 2px; }
  .done { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 2px; border: 0; background: none; text-align: left; }
  .done .ok { width: 22px; height: 22px; flex: none; color: var(--matcha); }
  .done .n { flex: 1; font-size: 15px; color: var(--sub); }
  .done .m { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* 完了した部屋の写真 */
  .viewer { position: fixed; inset: 0; z-index: 12; background: var(--bg); display: none; flex-direction: column;
    padding-top: env(safe-area-inset-top); }
  .viewer.on { display: flex; }
  .vhead { display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .vhead .ok { width: 26px; height: 26px; color: var(--matcha); flex: none; }
  .vhead .t { flex: 1; min-width: 0; }
  .vhead .t b { display: block; font-size: 18px; }
  .vhead .t span { font-size: 12px; color: var(--sub); }
  .x { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--line); color: var(--ink); flex: none;
    display: flex; align-items: center; justify-content: center; }
  .x svg { width: 18px; height: 18px; }
  .grid { flex: 1; overflow-y: auto; padding: 12px 12px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; align-content: start; }
  .grid button { padding: 0; border: 0; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--line); }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid .msg { grid-column: 1 / -1; text-align: center; color: var(--sub); font-size: 14px; padding: 40px 0; }
  .vfoot { padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); text-align: center; }
  .vfoot button { border: 0; background: none; color: var(--red); font-size: 14px; padding: 10px; }
  .lb { position: fixed; inset: 0; z-index: 13; background: #000; display: none; }
  .lb.on { display: block; }
  .lb .strip { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .lb .strip::-webkit-scrollbar { display: none; }
  .lb .strip div { flex: 0 0 100%; height: 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; }
  .lb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb .x { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 14px; background: rgba(255,255,255,.18); color: #fff; }
  .lb .count { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); text-align: center;
    color: rgba(255,255,255,.8); font-size: 13px; font-variant-numeric: tabular-nums; }

  /* 表示以外の施設 */
  .othersBtn { display: block; width: 100%; margin-top: 18px; height: 48px; border-radius: 14px; border: 1px dashed var(--line2);
    background: transparent; color: var(--sub); font-size: 14px; }
  .others { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .other { height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 15px; font-weight: 600; }
  .other:active { background: var(--matcha-bg); }
  .othersNote { grid-column: 1 / -1; color: var(--sub); font-size: 12px; text-align: center; margin-bottom: 2px; }

  /* 空・読み込み中 */
  .empty { text-align: center; padding: 70px 0 30px; color: var(--sub); font-size: 15px; line-height: 1.8; }
  .empty svg { width: 44px; height: 44px; color: var(--matcha); margin-bottom: 8px; }
  .skel { height: 58px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); margin: 0 0 12px 26px; opacity: .7; }
  .skel.s { height: 14px; width: 90px; border: 0; background: var(--line); border-radius: 7px; margin-bottom: 8px; }
  /* 期限順｜施設ごと */
  .order { display: flex; background: var(--line); border-radius: 10px; padding: 3px; margin: 0 0 14px; }
  .order button { flex: 1; border: 0; background: none; padding: 7px 0; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--sub); }
  .order button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .fhead { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 4px 7px; font-size: 15px; font-weight: 700; }
  .fhead span + span { font-size: 12px; font-weight: 600; }
  .fhead .r { color: var(--red); } .fhead .g { color: var(--matcha-ink); }
  .row.idle .nm { color: var(--muted); font-weight: 500; }
  .tm small { display: block; font-size: 11px; font-weight: 600; color: var(--sub); line-height: 1.2; }
  button.row { width: 100%; border: 0; background: none; text-align: left; font: inherit; color: inherit; }
  .row .rep { font-size: 13px; color: var(--sub); flex: none; }
  .okchip { flex: none; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--matcha-bg); color: var(--matcha-ink); }
  /* 今日のまとめ（管理画面と同じ帯） */
  .sum { display: flex; background: var(--line); border-radius: 10px; padding: 7px 4px; margin: -8px 0 18px; font-size: 12px; }
  .sum:empty { display: none; }
  .sum div { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 5px; }
  .sum div + div { border-left: 1px solid var(--line2); }
  .sum b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .sum .g { color: var(--matcha-ink); } .sum .r { color: var(--red); } .sum .k { color: var(--sub); }
  /* 運営メンバーだけ：清掃｜管理 の切り替え（合言葉は聞かない） */
  .modesw { display: flex; background: var(--line); border-radius: 999px; padding: 3px; flex: none; }
  .modesw[hidden] { display: none; }
  .modesw span, .modesw button { border: 0; background: none; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; color: var(--sub); }
  .modesw .on { background: var(--card); color: var(--ink); }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; line-height: 1.6; }

  /* 合言葉 */
  .veil { position: fixed; inset: 0; background: rgba(10,12,10,.5); display: none; align-items: center; justify-content: center;
    z-index: 10; padding: 20px; }
  .veil.on { display: flex; }
  .box { background: var(--card); color: var(--ink); border-radius: 24px; padding: 28px 22px 22px; width: min(92vw, 400px); text-align: center; }
  .box .t { font-size: 20px; font-weight: 700; }
  .box .s { color: var(--sub); margin-top: 6px; font-size: 14px; }
  .box input { width: 100%; font-size: 22px; padding: 14px; border-radius: 14px; border: 1px solid var(--line2);
    background: var(--bg); color: var(--ink); margin: 18px 0 8px; text-align: center; }
  .box .err { color: var(--red); font-size: 14px; min-height: 1.5em; }
  .box .go { width: 100%; height: 54px; font-size: 17px; font-weight: 700; color: #fff; background: var(--matcha);
    border: 0; border-radius: 16px; margin-top: 6px; }

  /* お知らせ */
  .toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(16px); bottom: calc(24px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg); padding: 13px 20px; border-radius: 999px; font-size: 15px; font-weight: 600;
    opacity: 0; transition: .25s; z-index: 20; white-space: nowrap; pointer-events: none; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.bad { background: var(--red); color: #fff; }

  /* 確認（ブラウザ標準の confirm はドメイン名が出て分かりにくいので自前で出す） */
  .sheet { position: fixed; inset: 0; background: rgba(10,12,10,.45); display: none; align-items: flex-end; justify-content: center;
    z-index: 15; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
  .sheet.on { display: flex; }
  .sheet .panel { width: min(100%, 496px); background: var(--card); color: var(--ink); border-radius: 24px; padding: 24px 18px 12px; text-align: center; }
  .sheet .q { white-space: pre-line; font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 18px; }
  .sheet button { display: block; width: 100%; height: 54px; border: 0; border-radius: 16px; font-size: 17px; font-weight: 700; }
  .sheet .yes { background: var(--red); color: #fff; }
  .sheet .no { background: transparent; color: var(--sub); margin-top: 4px; font-weight: 400; }
</style>
</head>
<body>
<main>
  <header>
    <div style="flex:1"><h1>清掃</h1><div class="sub"><span id="date">&nbsp;</span><span id="sync"></span></div></div>
    <div class="modesw" id="modeSw" hidden><span class="on">清掃</span><button data-act="toAdmin">管理</button></div>
  </header>
  <div class="sum" id="sum"></div>
  <div id="list"><div class="skel s"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="hint" id="hint"></div>

</main>

<input type="file" id="pick" accept="image/*" multiple hidden>

<div class="veil" id="passVeil">
  <form class="box" onsubmit="savePass(event)">
    <div class="t">合言葉を入れてください</div>
    <div class="s">最初の1回だけです</div>
    <input id="passInput" autocomplete="off" autocapitalize="off" enterkeyhint="go">
    <div class="err" id="passErr"></div>
    <button class="go" type="submit">はじめる</button>
  </form>
</div>
<div class="sheet" id="sheet">
  <div class="panel">
    <div class="q" id="sheetQ"></div>
    <button class="yes" id="sheetYes"></button>
    <button class="no" id="sheetNo">やめる</button>
  </div>
</div>
<div class="viewer" id="viewer">
  <div class="vhead"><span class="ok" id="vOk"></span><div class="t"><b id="vRoom"></b><span id="vWhen"></span></div>
    <button class="x" data-act="closeViewer" aria-label="閉じる"></button></div>
  <div class="grid" id="vGrid"></div>
  <div class="vfoot"><button id="vUndo">完了を取り消す</button></div>
</div>
<div class="viewer" id="roomSheet">
  <div class="vhead"><div class="t"><b id="rRoom"></b><span id="rWhen"></span></div>
    <button class="x" data-act="closeRoom" aria-label="閉じる"></button></div>
  <div class="rbody" id="rBody"></div>
  <div class="rfoot"><button class="bigBtn" id="rPick"></button></div>
</div>
<div class="lb" id="lb"><div class="strip" id="lbStrip"></div><button class="x" data-act="closeLb" aria-label="閉じる"></button><div class="count" id="lbCount"></div></div>
<div class="toast" id="toast"></div>

<script>
  // 画面が止まったときに原因が分かるよう、エラーを下に小さく出す
  function showErr(m) { const h = document.getElementById('hint'); if (h) h.textContent = '（エラー：' + m + '）'; }
  window.addEventListener('error', (e) => showErr(e.message));
  window.addEventListener('unhandledrejection', (e) => showErr((e.reason && e.reason.message) || String(e.reason)));
  const API_URL = 'https://ochahouse-clean-api.ishii-8e0.workers.dev';   // Cloudflare Workers（2026-09-26 Google Apps Script から移行）
  const PASS_KEY = 'ochahouse-clean-pass';
  const MAX_SIDE = 1024, QUALITY = 0.5;          // 画質は低くてよい（ishiiさん 2026-09-26）。軽いほど速く送れる
  const PARALLEL = 5;                            // 1枚ずつ、5本同時に送る（受け口は Cloudflare Workers で速い）
  const UPLOAD_TTL = 50 * 60 * 1000;             // Notionに預けた写真は1時間で消えるので、50分を過ぎたら送り直す
    let tasks = [], rooms = [], today = '', picking = null, running = false, passAsked = false, showOthers = false;

  // 受け口（Google Apps Script）は普段1〜2秒、ときどき10秒以上かかる。
  // 前回の一覧をこの端末に覚えておき、開いた瞬間に出す（最新は裏で取り直して差し替える）。
  const CACHE_KEY = 'ochahouse-clean-list';
  const jstToday = () => new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
  const nowIsoJst = () => new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 19) + '+09:00';
  // 並び：期限順（due）／施設ごと（fac）。前回の選択を覚える（ishiiさん 2026-09-27）
  let occ = {}, order = 'due';
  try { order = localStorage.getItem('ochahouse-clean-order') || 'due'; } catch (e) {}
  if (order !== 'fac') order = 'due';   // 壊れた値が残っていても期限順に戻す
  function setData(d) {
    tasks = d.tasks; today = d.today; rooms = d.rooms || rooms; occ = d.occ || occ;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ tasks: tasks, today: today, rooms: rooms, occ: occ })); } catch (e) {}
  }
  function loadCache() {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (c && c.today === jstToday()) { tasks = c.tasks; today = c.today; rooms = c.rooms || []; occ = c.occ || {}; return true; }
    } catch (e) {}
    return false;
  }

  // ---------------------------------------------------------------- 合言葉
  function getPass() { try { return localStorage.getItem(PASS_KEY) || ''; } catch (e) { return window._pass || ''; } }
  function setPass(v) { window._pass = v; try { v ? localStorage.setItem(PASS_KEY, v) : localStorage.removeItem(PASS_KEY); } catch (e) {} }
  function askPass(msg) {
    passAsked = true;
    document.getElementById('passErr').textContent = msg || '';
    document.getElementById('passVeil').classList.add('on');
    setTimeout(() => document.getElementById('passInput').focus(), 60);
  }
  // 合言葉の種類（運営メンバーなら 清掃｜管理 を切り替えられる）
  const ROLE_KEY = 'ochahouse-role', VIEW_KEY = 'ochahouse-view';
  const lsGet = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
  function showSwitch() { document.getElementById('modeSw').hidden = lsGet(ROLE_KEY) !== 'admin'; }
  async function checkRole() {
    if (lsGet(ROLE_KEY)) { showSwitch(); return; }
    try { lsSet(ROLE_KEY, (await api('whoami')).role); showSwitch(); } catch (e) {}
  }
  function toAdmin() { lsSet(VIEW_KEY, 'admin'); location.href = 'admin/'; }

  function savePass(ev) {
    ev.preventDefault();
    const v = document.getElementById('passInput').value.trim();
    if (!v) return;
    setPass(v); passAsked = false; lsSet(ROLE_KEY, '');
    document.getElementById('passVeil').classList.remove('on');
    load(); pump();
  }

  // ---------------------------------------------------------------- 受け口
  async function upload(b64, filename) {
    const blob = await (await fetch('data:image/jpeg;base64,' + b64)).blob();
    const f = new FormData();
    f.append('pass', getPass()); f.append('file', blob, filename);
    const j = await (await fetch(API_URL, { method: 'POST', body: f })).json();
    if (!j.ok && j.error === 'passcode') { setPass(''); askPass('合言葉がちがいます'); throw { silent: true }; }
    if (!j.ok) throw new Error(j.error || 'エラー');
    return j.data.upload;
  }

  async function api(action, extra) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ pass: getPass(), action: action }, extra || {})) });
    const j = await res.json();
    if (!j.ok && j.error === 'passcode') { setPass(''); askPass('合言葉がちがいます'); throw { silent: true }; }
    if (!j.ok) throw new Error(j.error || 'エラー');
    return j.data;
  }

  // ---------------------------------------------------------------- 送信待ちの保管（この端末の IndexedDB）
  // iPhoneのSafariやLINEの中のブラウザでは IndexedDB が開けない・返事が来ないことがある。
  // その時はこの画面を開いている間だけの保管に切り替え、一覧の表示は止めない。
  const mem = new Map();
  let dbp = null;
  function db() {
    if (!dbp) dbp = new Promise((ok) => {
      const t = setTimeout(() => ok(null), 1500);
      try {
        const r = indexedDB.open('ochahouse-clean', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('jobs', { keyPath: 'id' });
        r.onsuccess = () => { clearTimeout(t); ok(r.result); };
        r.onerror = r.onblocked = () => { clearTimeout(t); ok(null); };
      } catch (e) { clearTimeout(t); ok(null); }
    });
    return dbp;
  }
  function tx(mode, fn, fallback) {
    return db().then((d) => new Promise((ok) => {
      if (!d) return ok(fallback());
      try {
        const t = d.transaction('jobs', mode), st = t.objectStore('jobs'), q = fn(st);
        t.oncomplete = () => ok(q && q.result !== undefined ? q.result : undefined);
        t.onerror = t.onabort = () => ok(fallback());
      } catch (e) { ok(fallback()); }
    }));
  }
  async function jobs() { return (await tx('readonly', st => st.getAll(), () => Array.from(mem.values()))) || []; }
  function putJob(j) { mem.set(j.id, j); return tx('readwrite', st => { st.put(j); }, () => {}); }
  function delJob(id) { mem.delete(id); return tx('readwrite', st => { st.delete(id); }, () => {}); }

  // ---------------------------------------------------------------- 画面
  function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function hm(iso) { const m = /T([0-9][0-9]:[0-9][0-9])/.exec(iso || ''); return m ? m[1] : ''; }
  function toast(msg, bad) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast on' + (bad ? ' bad' : '');
    clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast' + (bad ? ' bad' : ''), bad ? 5000 : 2600);
  }

  const WDS = '日月火水木金土';
  const ICON_CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.4-2h6.2l1.4 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.8" r="3.4"/></svg>';
  const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.6 2.6 5-5.2"/></svg>';
  const ICON_LEAF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="M5 19c3-4 6-7 10-9"/></svg>';

  function mdw(ymd) { const d = new Date(ymd + 'T00:00:00+09:00'); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + WDS[d.getDay()]; }
  function rel(ymd) {
    const n = Math.round((new Date(ymd + 'T00:00:00+09:00') - new Date(today + 'T00:00:00+09:00')) / 86400000);
    return n === 0 ? '今日' : n === 1 ? '明日' : n === -1 ? '昨日' : mdw(ymd);
  }
  const dueDay = (t) => (t.due || '').slice(0, 10);
  const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  // 完了した日時：9/26 土 20:17 完了
  function doneWhen(t) { return t.doneAt ? mdw(t.doneAt.slice(0, 10)) + ' ' + hm(t.doneAt) + ' 完了' : '完了'; }

  // ---------------------------------------------------------------- 完了した部屋の写真を見る（取り消しもここから）
  let viewing = null, lbUrls = [];
  async function view(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    if (id.indexOf('tmp-') === 0) { toast('送信の仕上げ中です。数秒後にもう一度押してください', true); return; }
    viewing = id;
    document.getElementById('vOk').innerHTML = ICON_OK;
    document.getElementById('vRoom').textContent = t.room;
    document.getElementById('vWhen').textContent = doneWhen(t) + '・写真' + (t.photos || 0) + '枚';
    const g = document.getElementById('vGrid');
    g.innerHTML = t.photos ? Array.from({ length: t.photos }, () => '<button></button>').join('') : '<div class="msg">写真はありません</div>';
    document.querySelectorAll('.viewer .x, .lb .x').forEach(b => b.innerHTML = ICON_X);
    document.getElementById('viewer').classList.add('on');
    try {
      const d = await api('photos', { id: id });
      if (viewing !== id) return;
      lbUrls = d.urls;
      g.innerHTML = d.urls.length ? d.urls.map((u, i) => '<button data-act="zoom" data-id="' + i + '"><img src="' + esc(u) + '" loading="lazy" alt=""></button>').join('')
                                  : '<div class="msg">写真はありません</div>';
    } catch (e) { if (!e.silent && viewing === id) g.innerHTML = '<div class="msg">写真を読み込めませんでした</div>'; }
  }
  function closeViewer() { viewing = null; document.getElementById('viewer').classList.remove('on'); }
  function zoom(i) {
    const st = document.getElementById('lbStrip');
    st.innerHTML = lbUrls.map(u => '<div><img src="' + esc(u) + '" alt=""></div>').join('');
    document.getElementById('lb').classList.add('on');
    st.scrollLeft = st.clientWidth * i;
    const cnt = () => document.getElementById('lbCount').textContent = (Math.round(st.scrollLeft / st.clientWidth) + 1) + ' / ' + lbUrls.length;
    st.onscroll = cnt; cnt();
  }
  function closeLb() { document.getElementById('lb').classList.remove('on'); }
  document.getElementById('vUndo').addEventListener('click', async () => {
    const id = viewing; if (!id) return;
    const t = tasks.find(x => x.id === id);
    if (!t || !(await ask(t.room + ' の完了を\n取り消しますか？\n（送った写真も外れます）', '取り消す'))) return;
    closeViewer(); undo(id, true);
  });

  function miniRing(j) {
    const all = j.photos.length || 1, sent = j.uploads.filter(Boolean).length, C = 2 * Math.PI * 16;
    return '<svg class="mini' + (j.state === 'waiting' ? ' wait' : '') + '" viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="16"/>'
      + '<circle class="val" cx="20" cy="20" r="16" stroke-dasharray="' + (C * sent / all).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 20 20)"/>'
      + '<text x="20" y="23.5" text-anchor="middle">' + sent + '/' + j.photos.length + '</text></svg>';
  }
  function jobNote(j) {
    const sent = j.uploads.filter(Boolean).length;
    if (j.state === 'waiting') return '<small class="warn">電波が戻ったら続きを自動で送ります</small>';
    if (j.state === 'preparing') return '<small>写真を準備しています…</small>';
    return '<small>' + (sent === j.photos.length ? '完了にしています…' : '写真を送っています…') + '</small>';
  }

  function row(t, j) {
    const early = /アーリー/.test(t.deadline);
    let sub = '';
    if (early) sub = '<small class="warn">アーリーチェックイン</small>';
    else if (t.day > today) sub = '<small>' + rel(t.day) + ' ' + (t.day.slice(5, 7) * 1) + '/' + (t.day.slice(8) * 1) + (t.out ? ' ' + t.out : '') + ' OUT後</small>';
    if (j) sub = jobNote(j);
    const note = t.note && !j ? '<span class="note">' + esc(t.note) + '</span>' : '';
    // 施設ごとの表示では、今日以外の期限に日付も添える（時刻だけだと今日に見えるため）
    const tmx = t.due ? (t._fac && dueDay(t) !== today ? '<small>' + md(dueDay(t)) + '</small>' : '') + hm(t.due) : '—';
    const inner = '<div class="tm">' + tmx + '</div><div class="nm">' + esc(t.room) + sub + note + '</div>'
      + (j ? miniRing(j) : '<div class="cam">' + ICON_CAM + '</div>');
    if (j) return '<div class="row">' + inner + '</div>';
    // カメラのボタン＝そのまま写真を選ぶ。それ以外のところ＝部屋の画面（入室方法と「写真を選んで完了」）（ishiiさん 2026-09-27）
    return '<div class="row" role="button" tabindex="0" data-act="room" data-id="' + t.id + '">'
      + inner.replace('<div class="cam">', '<button class="cam" data-act="pick" data-id="' + t.id + '" aria-label="' + esc(t.room) + ' の写真を選んで完了">').replace(/<\/div>$/, '</button>') + '</div>';
  }

  function setRing(done, total) {
    const C = 2 * Math.PI * 25;
    const v = document.getElementById('ringVal');
    v.setAttribute('stroke-dasharray', (total ? C * done / total : 0).toFixed(1) + ' ' + C.toFixed(1));
    v.style.opacity = total && done ? 1 : 0;   // 0件のときに丸い端が点として残らないように
    document.getElementById('ringText').textContent = total ? done + '/' + total : '—';
  }

  // 施設ごと：全部屋を部屋番号順に。まだの清掃・今日完了・滞在中・空室（空室は一覧外の清掃として報告できる）
  const FACS = ['原宿', '麻布十番', '森下', '八広'];
  function facView(js, live, todo, done) {
    let h = '';
    FACS.forEach(fac => {
      const rs = rooms.filter(r => r.split(' ')[0] === fac);
      if (!rs.length) return;
      let open = 0, body = '';
      rs.forEach(r => {
        const num = r.split(' ')[1];
        const ex = js['room:' + r];
        if (ex && ex.state !== 'completing') body += row({ id: ex.id, room: num, due: '', deadline: '', day: today }, ex);
        const ts = todo.filter(t => t.room === r);
        open += ts.length;
        ts.forEach(t => { body += row(Object.assign({}, t, { room: num, _fac: true }), live(t.id)); });
        const ds = done.filter(t => t.room === r);
        ds.forEach(t => {
          body += '<button class="row fdone" data-act="view" data-id="' + t.id + '"><div class="tm"></div><div class="nm">' + num
            + '<small>' + doneWhen(t) + '・' + (t.photos || 0) + '枚</small></div><span class="okchip">完了</span></button>';
        });
        if (!ts.length && !ds.length && !(ex && ex.state !== 'completing')) {
          const o = occ[r] || {};
          body += o.state === 'stay'
            ? '<div class="row idle"><div class="tm"></div><div class="nm">' + num + '<small>滞在中（' + md(o.out) + ' OUT）</small></div></div>'
            : '<button class="row idle" data-act="pick" data-id="room:' + esc(r) + '"><div class="tm"></div><div class="nm">' + num
              + '<small>空室' + (o.nextIn ? '・次のIN ' + md(o.nextIn) : '') + '</small></div><span class="rep">報告 ›</span></button>';
        }
      });
      h += '<div class="fhead"><span>' + fac + '</span><span class="' + (open ? 'r' : 'g') + '">' + (open ? '未完了 ' + open : 'すべて完了') + '</span></div>'
        + '<div class="card">' + body + '</div>';
    });
    return h;
  }
  const md = (ymd) => (ymd.slice(5, 7) * 1) + '/' + (ymd.slice(8) * 1);

  async function render() {
    const js = {}; (await jobs()).forEach(j => js[j.id] = j);
    const live = (id) => js[id] && js[id].state !== 'completing' ? js[id] : null;
    const todo = tasks.filter(t => !t.done), done = tasks.filter(t => t.done);

    // リング：今日が締切の部屋（過ぎたものも含む）だけを数える。先の締切の部屋を前倒しで終えても数えない（ishiiさん 2026-09-26）
    const mustToday = todo.filter(t => t.due && dueDay(t) <= today);
    const doneToday = done.filter(t => t.due && dueDay(t) <= today);
    document.getElementById('sum').innerHTML = today ? '<div><span class="k">今日IN</span><b>' + (mustToday.length + doneToday.length) + '</b></div>'
      + '<div><span class="g">完了</span><b class="g">' + doneToday.length + '</b></div>'
      + '<div><span class="r">未完了</span><b class="r">' + mustToday.length + '</b></div>' : '';
    let subText = '';
    if (today) {
      const next = todo.filter(t => t.due).sort((a, b) => a.due < b.due ? -1 : 1)[0];
      subText = '本日（' + mdw(today) + '）' + (mustToday.length || doneToday.length ? '' : next ? '・今日の締切なし' : '・清掃待ちなし');
    }
    document.getElementById('date').textContent = subText || '\u00a0';

    const orderBar = today ? '<div class="order"><button data-act="order" data-id="due"' + (order === 'due' ? ' class="on"' : '') + '>期限順</button>'
      + '<button data-act="order" data-id="fac"' + (order === 'fac' ? ' class="on"' : '') + '>施設ごと</button></div>' : '';
    if (order === 'fac' && today) {
      document.getElementById('list').innerHTML = orderBar + facView(js, live, todo, done);
      document.getElementById('hint').textContent = '';
      return;
    }

    // 日付ごとにまとめる（期限の早い順。過ぎたものは「期限切れ」、期限なしは最後）
    const groups = new Map();
    const key = (t) => !t.due ? 'none' : dueDay(t) < today ? 'over' : dueDay(t);
    todo.slice().sort((a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : 1).forEach(t => {
      const k = key(t); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t);
    });
    let h = '';
    // 一覧外の部屋（表示以外の施設）で送信中のもの
    const extra = Object.values(js).filter(j => j.id.indexOf('room:') === 0 && j.state !== 'completing');
    if (extra.length) {
      h += '<div class="day"><div class="dot"></div><div class="dl">一覧外の清掃</div><div class="card">'
        + extra.map(j => row({ id: j.id, room: j.room, due: '', deadline: '', day: today }, j)).join('') + '</div></div>';
    }
    groups.forEach((list, k) => {
      const hot = k === 'over' || k === today;
      const label = k === 'over' ? '期限切れ' : k === 'none' ? '次の予約なし' : k === today ? '今日締切 ' + mdw(k) : rel(k) === '明日' ? '明日 ' + mdw(k) : mdw(k);
      h += '<div class="day' + (hot ? ' hot' : '') + (k === 'none' ? ' none' : '') + '"><div class="dot"></div><div class="dl">' + label + '</div>'
        + '<div class="card">' + list.map(t => row(t, live(t.id))).join('') + '</div></div>';
    });
    h = h ? '<div class="tl">' + h + '</div>' : '';
    if (today && !h) h = '<div class="empty">' + ICON_LEAF + '<br>清掃待ちの部屋はありません' + (done.length ? '<br>おつかれさまでした' : '') + '</div>';

    if (done.length) {
      h += '<div class="doneBox"><div class="cap">今日完了</div>' + done.map(t =>
        '<button class="done" data-act="view" data-id="' + t.id + '"><span class="ok">' + ICON_OK + '</span><span class="n">' + esc(t.room)
        + '</span><span class="m">' + doneWhen(t) + '・' + (t.photos || 0) + '枚</span></button>').join('') + '</div>';
    }
    if (today) {
      const busy = new Set(todo.map(t => t.room).concat(Object.values(js).map(j => j.room)));
      const rest = rooms.filter(r => !busy.has(r));
      h += '<button class="othersBtn" data-act="others">' + (showOthers ? '閉じる' : '表示以外の施設') + '</button>';
      if (showOthers) {
        h += '<div class="others"><div class="othersNote">一覧にない部屋を掃除したときはここから</div>'
          + rest.map(r => '<button class="other" data-act="pick" data-id="room:' + esc(r) + '">' + esc(r) + '</button>').join('') + '</div>';
      }
    }
    document.getElementById('list').innerHTML = orderBar + h;
    document.getElementById('hint').textContent = todo.length ? '部屋を押して、撮った写真をまとめて選ぶと完了します' : '';
  }

  async function load() {
    if (!getPass()) { askPass(); return; }
    const sync = document.getElementById('sync');
    if (tasks.length || today) sync.textContent = '・更新中';
    try { setData(await api('list')); render(); checkRole(); }
    catch (e) {
      if (e.silent) return;
      if (!today) document.getElementById('list').innerHTML = '<div class="empty">読み込めませんでした<br>電波の良い所で開き直してください</div>';
      showErr(e.message || String(e));
    } finally { sync.textContent = ''; }
  }

  // ---------------------------------------------------------------- 写真を選ぶ → 縮める → 保管
  function pick(id) { picking = id; const p = document.getElementById('pick'); p.value = ''; p.click(); }

  function shrink(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', QUALITY).split(',')[1]);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('写真を読み込めませんでした')); };
      img.src = url;
    });
  }

  document.getElementById('pick').addEventListener('change', async (ev) => {
    const files = Array.from(ev.target.files || []);
    const id = picking; picking = null;
    if (!files.length || !id) return;
    const t = tasks.find(x => x.id === id);
    if (id.indexOf('room:') === 0) showOthers = false;
    const job = { id: id, room: t ? t.room : id.replace(/^room:/, ''), photos: [], uploads: [], at: [], state: 'preparing', created: Date.now() };
    await putJob(job); render();
    for (const f of files) {
      try { job.photos.push(await shrink(f)); } catch (e) { /* 読めない写真は飛ばす */ }
      job.uploads.push(null); job.at.push(0);
      await putJob(job); render();
    }
    if (!job.photos.length) { await delJob(id); render(); toast('写真を読み込めませんでした。もう一度選んでください', true); return; }
    job.state = 'sending'; await putJob(job);
    pump();
  });

  // ---------------------------------------------------------------- 送信（1枚ずつ。失敗しても保管したまま、あとで続きから）
  async function pump() {
    if (running || !getPass()) return;
    running = true;
    try {
      for (const job of await jobs()) {
        if (job.state === 'preparing' && Date.now() - job.created < 5 * 60 * 1000) continue;  // まだ写真を縮めている途中
        job.state = 'sending'; await putJob(job); render();
        try {
          // まだ届いていない写真を、PARALLEL 本ずつ同時に1枚ずつ送る
          const todoIdx = job.photos.map((_, i) => i).filter(i => !(job.uploads[i] && Date.now() - job.at[i] < UPLOAD_TTL));
          const worker = async () => {
            for (let i = todoIdx.shift(); i !== undefined; i = todoIdx.shift()) {
              job.uploads[i] = await upload(job.photos[i], 'photo' + (i + 1) + '.jpg'); job.at[i] = Date.now();
              await putJob(job); render();
            }
          };
          await Promise.all(Array.from({ length: PARALLEL }, worker));
          const room = job.id.indexOf('room:') === 0 ? job.id.slice(5) : '';
          // 写真が全部届いたら、返事を待たずに画面上は完了にする（失敗したら元に戻して再送）
          job.state = 'completing'; await putJob(job);
          const n = job.uploads.filter(Boolean).length, t = tasks.find(x => x.id === job.id);
          const tmp = { id: 'tmp-' + job.id, room: job.room, done: true, doneAt: nowIsoJst(), photos: n };
          if (t) Object.assign(t, { done: true, doneAt: tmp.doneAt, photos: n }); else tasks.push(tmp);
          render();
          toast(job.room + ' 完了');
          try {
            setData(await api('complete', room ? { room: room, uploads: job.uploads.filter(Boolean) }
                                                : { id: job.id, uploads: job.uploads.filter(Boolean) }));
          } catch (e) {
            if (t) t.done = false; else tasks = tasks.filter(x => x !== tmp);
            throw e;
          }
          await delJob(job.id);
          render();
        } catch (e) {
          if (e && e.silent) break;
          job.state = 'waiting'; await putJob(job); render();
        }
      }
    } finally { running = false; }
  }

  // ---------------------------------------------------------------- 確認
  function ask(q, yes) {
    return new Promise((ok) => {
      const el = document.getElementById('sheet');
      document.getElementById('sheetQ').textContent = q;
      document.getElementById('sheetYes').textContent = yes;
      const done = (v) => { el.classList.remove('on'); el.onclick = null; ok(v); };
      el.onclick = (e) => {
        if (e.target.id === 'sheetYes') done(true);
        else if (e.target.id === 'sheetNo' || e.target === el) done(false);
      };
      el.classList.add('on');
    });
  }

  // ---------------------------------------------------------------- 取り消し
  async function undo(id, confirmed) {
    const t = tasks.find(x => x.id === id);
    if (t && id.indexOf('tmp-') === 0) { toast('送信の仕上げ中です。数秒後にもう一度押してください', true); return; }
    if (!t || (!confirmed && !(await ask(t.room + ' の完了を\n取り消しますか？', '取り消す')))) return;
    // 返事を待たずに画面を戻す。失敗したら元に戻す
    const before = { done: t.done, doneAt: t.doneAt };
    if (t.deadline === '一覧外の清掃') tasks = tasks.filter(x => x !== t); else Object.assign(t, { done: false, doneAt: '' });
    render(); toast('取り消しました');
    try { setData(await api('undo', { id: id })); render(); }
    catch (e) {
      if (!tasks.includes(t)) tasks.push(t);
      Object.assign(t, before); render();
      if (!e.silent) toast('取り消せませんでした。もう一度押してください', true);
    }
  }

  // ---------------------------------------------------------------- 部屋の画面（入室方法）
  // 番号はNotion「🔑 キーボックス管理」から開くたびに読む（端末には残さない）
  let roomOpen = null;
  async function openRoom(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    roomOpen = id;
    document.getElementById('rRoom').textContent = t.room;
    document.getElementById('rWhen').textContent = t.due ? rel(dueDay(t)) + ' ' + hm(t.due) + 'まで' + (/アーリー/.test(t.deadline) ? '（アーリー）' : '') : '次の予約なし';
    document.getElementById('rPick').innerHTML = ICON_CAM + '写真を選んで完了';
    document.querySelector('#roomSheet .x').innerHTML = ICON_X;
    const body = document.getElementById('rBody');
    body.innerHTML = (t.note ? '<div class="note" style="margin:0 0 14px">' + esc(t.note) + '</div>' : '')
      + '<div class="rsec">入室方法</div><div id="rKeys"><div class="key"><div class="knote">読み込み中…</div></div></div>';
    document.getElementById('roomSheet').classList.add('on');
    try {
      const d = await api('access', { room: t.room });
      if (roomOpen !== id) return;
      document.getElementById('rKeys').innerHTML = d.items.length ? d.items.map(k =>
        '<div class="key' + (k.kind === 'ゲスト用' ? '' : ' spare') + '"><span class="kind">' + (k.kind === 'ゲスト用' ? 'ゲスト用' : 'スタッフ用スペア') + '</span>'
        + (k.warn ? '<span class="warnTag">要注意</span>' : '')
        + (k.place ? '<div class="place">' + esc(k.place) + '</div>' : '')
        + '<div class="code">' + (k.post ? '<div>ポスト<b>' + esc(k.post) + '</b></div>' : '') + (k.box ? '<div>キーボックス<b>' + esc(k.box) + '</b></div>' : '') + '</div>'
        + (k.note ? '<div class="knote">' + esc(k.note) + '</div>' : '') + '</div>').join('')
        : '<div class="key"><div class="knote">この部屋の入室方法が登録されていません</div></div>';
    } catch (e) {
      if (!e.silent && roomOpen === id) document.getElementById('rKeys').innerHTML = '<div class="key"><div class="knote">入室方法を読み込めませんでした。電波の良い所で開き直してください</div></div>';
    }
  }
  function closeRoom() { roomOpen = null; document.getElementById('roomSheet').classList.remove('on'); document.getElementById('rKeys') && (document.getElementById('rBody').innerHTML = ''); }
  document.getElementById('rPick').addEventListener('click', () => { const id = roomOpen; closeRoom(); if (id) pick(id); });

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    ({ order: (v) => { order = v; try { localStorage.setItem('ochahouse-clean-order', v); } catch (e) {} render(); }, toAdmin: toAdmin, room: openRoom, closeRoom: closeRoom, pick: pick, undo: undo, view: view, zoom: (i) => zoom(+i), closeViewer: closeViewer, closeLb: closeLb,
       others: () => { showOthers = !showOthers; render(); } })[b.dataset.act](b.dataset.id);
  });
  window.addEventListener('online', pump);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); pump(); } });
  setInterval(() => { if (!document.hidden && !passAsked) { load(); pump(); } }, 60000);
  // 運営メンバーが前回「管理」を見ていたら、そのまま管理画面を開く
  if (lsGet(ROLE_KEY) === 'admin' && lsGet(VIEW_KEY) === 'admin' && getPass()) location.replace('admin/');
  showSwitch();
  if (loadCache()) render();
  load(); pump();
</script>
</body>
</html>
