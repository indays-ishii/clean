<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="清掃">
<meta name="theme-color" content="#f6f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121411" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>清掃</title>
<!--
  OCHAHOUSE 清掃会社用「清掃」（GitHub Pages: indays-ishii/clean）
  ishiiさん決定 2026-09-26：機能は完了報告だけ。デザインとシンプルさを磨く。
  全部屋を4つに分けて出す（ishiiさん 2026-09-27、名前は 9/28）：清掃待ち（空室で未完了。カメラはここだけ）／チェックアウト待ち（OUT前。OUT時刻を過ぎたら上へ）
  ／清掃済み（次のIN順。今日INは先頭）／滞在中（畳む）。上に今日INの準備ゲージ（管理画面と同じ）。
  使い方：部屋を押す → 写真をまとめて選ぶ（1回15枚ほど）→ 1枚ずつ送信 → 全部届いたら自動で完了。
  電波が切れても写真はこの端末に残り、つながったら続きから自動で送る。
  データの読み書きは Cloudflare Workers の受け口 API_URL（ochahouse-ops/cleaning-worker）。合言葉はこのページに書かない。
-->
<style>
  /* デザイン：4つの区分＋日付ごとの時間軸（K案）＋今日INの準備ゲージ。抹茶色は「押すところ」、赤は「今日締切」だけ（ishiiさん 2026-09-26） */
  :root {
    --bg: #f6f6f2; --card: #ffffff; --ink: #1d1f1b; --sub: #6d7169; --muted: #a4a79f; --line: #e6e7e1; --line2: #d5d7cf;
    --matcha: #5b8e3e; --matcha-ink: #3f6a28; --matcha-bg: #edf3e6;
    --red: #c4442c; --red-line: #eeb8ab; --red-bg: #fcefeb; --amber: #8a6512; --amber-bg: #fbf3df;
    --blue: #2f5f9e; --blue-bg: #e8eff9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121411; --card: #1b1d1a; --ink: #eef0ea; --sub: #a1a59c; --muted: #6c7068; --line: #2a2d28; --line2: #3a3e37;
      --matcha: #7fb65c; --matcha-ink: #a9d68a; --matcha-bg: #1f2c18;
      --red: #ff7a5e; --red-line: #6e2f23; --red-bg: #2f1a15; --amber: #e0b85a; --amber-bg: #2c2512;
      --blue: #8fb4ea; --blue-bg: #1a2436; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 520px; margin: 0 auto;
    padding: calc(22px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; }

  /* 見出し */
  header { display: flex; align-items: center; gap: 14px; margin: 4px 2px 22px; }
  h1 { font-size: 19px; font-weight: 700; margin: 0; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
  h1 .lbl { display: block; font-size: 11px; font-weight: 600; color: var(--sub); letter-spacing: 0; margin-bottom: 1px; }   /* 「本日」は小さく上に（ishiiさん 2026-09-28） */
  .sub { color: var(--sub); font-size: 13px; margin-top: 3px; }
  #sync { color: var(--muted); }
  /* 見出しは「清掃」の文字をやめて本日の日付に（ishiiさん 2026-09-28） */
  #sync:empty { display: none; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }

  .row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 13px 12px 13px 14px; border: 0; background: none;
    text-align: left; transition: background .15s; }
  .row + .row { border-top: 1px solid var(--line); }
  div.row[data-act] { cursor: pointer; }
  div.row[data-act]:active { background: var(--matcha-bg); }
  button.cam { padding: 0; }
  button.cam:active { transform: scale(.92); }

  /* 部屋の画面（入室方法） */
  .rbody { flex: 1; overflow-y: auto; padding: 14px 16px 12px; }
  .rsec { font-size: 12px; font-weight: 700; color: var(--sub); margin: 4px 2px 8px; }
  /* 入室方法：ゲスト用とスタッフ用スペアを左右に並べ、少し小さく（ishiiさん 2026-09-28） */
  #rKeys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  #rKeys .key:only-child { grid-column: 1 / -1; }
  .key { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 11px; min-width: 0; }
  .key .kind { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--matcha-bg); color: var(--matcha-ink); }
  .key.spare .kind { background: var(--line); color: var(--sub); }
  .key .warnTag { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--red-bg); color: var(--red); margin-left: 6px; }
  .key .place { font-size: 12px; margin-top: 6px; line-height: 1.45; }
  .key .code { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
  .key .code div { font-size: 10px; color: var(--sub); }
  .key .code b { display: block; font-size: 19px; color: var(--ink); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .key .knote { font-size: 11px; color: var(--sub); margin-top: 5px; line-height: 1.45; }
  .rfoot { display: flex; gap: 8px; padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  .bigBtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 56px; border: 0; border-radius: 16px;
    background: var(--matcha); color: #fff; font-size: 17px; font-weight: 700; }
  .bigBtn svg { width: 22px; height: 22px; }
  .tm { width: 46px; flex: none; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .01em; text-align: center; }
  .tm small { display: block; font-size: 10px; font-weight: 400; color: var(--sub); line-height: 1.2; }
  .nm { flex: 1; min-width: 0; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .nm small { display: block; font-size: 12px; font-weight: 400; color: var(--sub); margin-top: 2px; }
  .nm small.warn { color: var(--red); }
  .nm .note { display: block; font-size: 12px; font-weight: 400; color: var(--amber); background: var(--amber-bg);
    border-radius: 8px; padding: 5px 8px; margin-top: 6px; line-height: 1.45; }
  /* カメラも緑の外枠だけ（ishiiさん 2026-09-28） */
  .cam { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--card); color: var(--matcha-ink); border: 2px solid var(--matcha);
    display: flex; align-items: center; justify-content: center; }
  .cam svg { width: 20px; height: 20px; }
  .mini { width: 40px; height: 40px; flex: none; }
  .mini circle { fill: none; stroke-width: 4; }
  .mini .track { stroke: var(--line); }
  .mini .val { stroke: var(--matcha); stroke-linecap: round; transition: stroke-dasharray .3s; }
  .mini.wait .val { stroke: var(--red); }
  .mini text { font-size: 10px; font-weight: 600; fill: var(--sub); }

  /* 部屋の画面・写真を大きく */
  .viewer { position: fixed; inset: 0; z-index: 12; background: var(--bg); display: none; flex-direction: column;
    padding-top: env(safe-area-inset-top); }
  .viewer.on { display: flex; }
  .vhead { display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .vhead .t { flex: 1; min-width: 0; }
  .vhead .t b { display: block; font-size: 18px; }
  .vhead .t span { font-size: 12px; color: var(--sub); }
  /* 期限は大事なので大きく（色の帯は付けない。今日・過ぎたものは赤） */
  .rWhen { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .rWhen .dl { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin-top: 8px; }
  .rWhen b { font-size: 18px; color: var(--ink); }
  .rWhen.hot b { color: var(--red); }
  .rWhen .tag { vertical-align: 3px; margin-left: 0; }
  .rfoot .bigBtn { flex: 1; width: auto; min-width: 0; font-size: 15px; gap: 6px; padding: 0 6px; white-space: nowrap; }
  .rfoot .bigBtn.two { white-space: normal; }
  .rfoot .bigBtn svg { width: 19px; height: 19px; }
  .rfoot #rPick { flex: 1.25; }
  .tag.part { background: var(--blue-bg); color: var(--blue); }
  .nm small.part { color: var(--blue); }
  /* 途中まで清掃報告 */
  .prog { background: var(--blue-bg); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
  .pchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .pchip { font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--card); color: var(--muted); border: 1px solid var(--line); }
  .pchip.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .phist { font-size: 12px; color: var(--blue); line-height: 1.6; }
  .pgrid.part { margin: 10px 0 0; }
  .chkl { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 2px 14px; margin-bottom: 14px; }
  .chkl label { display: flex; align-items: center; gap: 12px; padding: 13px 0; font-size: 16px; }
  .chkl label + label { border-top: 1px solid var(--line); }
  .pgh { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; margin: 4px 2px 8px; }
  .pgh svg { width: 24px; height: 24px; color: var(--matcha); flex: none; stroke-width: 2; }
  /* 印は塗りつぶさず、緑のチェックだけ（ishiiさん 2026-09-28） */
  .chkl input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; margin: 0; flex: none; border: 2px solid var(--line2);
    border-radius: 6px; background: var(--card); display: grid; place-content: center; }
  .chkl input[type=checkbox]:checked { border-color: var(--matcha); }
  .chkl input[type=checkbox]:checked::before { content: ""; width: 12px; height: 6px; border-left: 3px solid var(--matcha); border-bottom: 3px solid var(--matcha);
    transform: translateY(-2px) rotate(-45deg); }
  .chkl .pother { display: block; width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; margin: 0 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: var(--bg); color: var(--ink); }
  .chkl .pother[hidden] { display: none; }
  .pmemo { width: 100%; min-height: 70px; font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card); color: var(--ink); margin-bottom: 14px; }
  .ppick { display: block; width: 100%; border: 1px dashed var(--line2); background: var(--card); border-radius: 12px; padding: 12px; color: var(--matcha-ink); font-size: 14px; font-weight: 600; }
  .vhead .t .rToday { display: block; font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 3px; }   /* 部屋の画面にも本日の日付を小さく */
  .x { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--line); color: var(--ink); flex: none;
    display: flex; align-items: center; justify-content: center; }
  .x svg { width: 18px; height: 18px; }
  .lb { position: fixed; inset: 0; z-index: 13; background: #000; display: none; }
  .lb.on { display: block; }
  .lb .strip { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .lb .strip::-webkit-scrollbar { display: none; }
  .lb .strip div { flex: 0 0 100%; height: 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; }
  .lb img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lb .x { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 14px; background: rgba(255,255,255,.18); color: #fff; }
  .lb .count { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom)); text-align: center;
    color: rgba(255,255,255,.8); font-size: 13px; font-variant-numeric: tabular-nums; }

  /* 空・読み込み中 */
  .empty { text-align: center; padding: 70px 0 30px; color: var(--sub); font-size: 15px; line-height: 1.8; }
  .empty svg { width: 44px; height: 44px; color: var(--matcha); margin-bottom: 8px; }
  .skel { height: 58px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); margin: 0 0 12px; opacity: .7; }
  .skel.s { height: 14px; width: 90px; border: 0; background: var(--line); border-radius: 7px; margin-bottom: 8px; }
  .row.idle .nm { color: var(--muted); font-weight: 500; }
  button.row { width: 100%; border: 0; background: none; text-align: left; font: inherit; color: inherit; }
  .row .rep { font-size: 13px; color: var(--sub); flex: none; margin-left: auto; }
  /* 清掃の予定が無い部屋：緑の外枠だけ。「前回の清掃に写真を追加」と「新規の清掃を報告」を左右に（ishiiさん 2026-09-27） */
  .bigBtn.sub { background: var(--card); color: var(--matcha-ink); border: 2px solid var(--matcha); }
  .bigBtn.two { flex-direction: column; gap: 3px; height: 66px; font-size: 14px; line-height: 1.25; }
  .bigBtn[hidden] { display: none; }
  .lastPhotos { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 14px; font-size: 14px; font-weight: 600; color: var(--matcha-ink); }
  /* 前のゲストOUT → 次のゲストIN（人数を大きく。タオル・アメニティの数に使う。ishiiさん 2026-09-28） */
  .gcards { display: flex; align-items: stretch; gap: 6px; }
  .gcard { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 11px; }
  .gcard.nx { flex: 1.35; background: var(--matcha-bg); border-color: var(--matcha); color: var(--matcha-ink); }
  .gcard .glb { font-size: 11px; color: var(--sub); }
  .gcard.nx .glb { color: var(--matcha-ink); }
  .gcard .tt { font-size: 17px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .gcard .tag { margin: 4px 0 0; }
  .tag.late { background: var(--amber-bg); color: var(--amber); }
  .tag.earlyR { background: var(--red-bg); color: var(--red); }
  .gcard .ns { font-size: 12px; color: var(--sub); margin-top: 6px; }
  .gcard .ppl { display: flex; align-items: baseline; gap: 5px; margin-top: 6px; }
  .gcard .ppl b { font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
  .gcard .ppl .ns { margin: 0 0 0 auto; }
  .gcard .ppl .nn { margin-left: auto; display: flex; align-items: baseline; gap: 4px; }
  .gcard .ppl svg { align-self: center; flex: none; }
  /* 前のゲストの人数・泊数は小さく（次のゲストほど大事ではない。ishiiさん 2026-09-28） */
  .gcard .pps { display: flex; align-items: center; gap: 3px; font-size: 13px; color: var(--sub); margin-top: 8px; white-space: nowrap; }
  .gcard .pps svg { width: 14px; height: 14px; flex: none; }
  .gcard .pps svg:nth-of-type(2) { margin-left: 8px; }
  .garrow { display: flex; align-items: center; color: var(--muted); }
  .gnote { font-size: 11px; color: var(--sub); margin: 8px 2px 16px; }
  .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: -6px 0 16px; }
  .pgrid:empty { display: none; }
  .pgrid button { padding: 0; border: 0; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--line); }
  .pgrid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pgrid .pmsg { grid-column: 1 / -1; text-align: center; color: var(--sub); font-size: 13px; padding: 14px 0; }
  .okchip { flex: none; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--matcha-bg); color: var(--matcha-ink); }
  /* 4つの区分：清掃待ち／チェックアウト待ち／清掃済み／滞在中（ishiiさん 2026-09-27） */
  .sec { display: flex; justify-content: space-between; align-items: baseline; margin: 24px 4px 8px; }
  .sec b { font-size: 16px; } .sec span { font-size: 12px; color: var(--sub); }
  .sec.dim b { color: var(--sub); }
  .card.now { border: 1.5px solid var(--matcha); }
  .dh { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--sub); padding: 8px 14px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .dh .dd { font-size: 15px; color: var(--ink); }
  .dh .dr { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--sub); }
  .dh .dtag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--amber-bg); color: var(--amber); }
  .dh .dtag.hot { background: var(--red-bg); color: var(--red); }
  .grp .tm { width: 54px; }
  .grp .tm small { white-space: nowrap; }
  .tm .i { display: block; font-size: 10px; font-weight: 700; color: var(--sub); line-height: 1.1; }
  .grp + .grp .dh { border-top: 1px solid var(--line); }
  .grp.hot .dh .dd, .grp.hot .tm { color: var(--red); }
  .fac { display: block; font-size: 11px; font-weight: 500; color: var(--sub); }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
  .tag.early { background: var(--amber-bg); color: var(--amber); }
  .tag.inT { background: var(--matcha-bg); color: var(--matcha-ink); }
  .stay { flex: none; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--amber-bg); color: var(--amber); }
  .secNote { font-size: 11px; color: var(--muted); margin: 6px 4px 0; }
  .none { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 18px; color: var(--sub); font-size: 14px; }
  .none svg { width: 22px; height: 22px; color: var(--matcha); }
  /* 完了の取り消し：赤い外枠のボタンにして見つけやすく（ishiiさん 2026-09-28） */
  .undoLink { display: block; width: 100%; margin: 16px 0 0; height: 48px; border: 2px solid var(--red); border-radius: 14px; background: var(--card); color: var(--red); font-size: 15px; font-weight: 700; }
  /* 今日のまとめ：丸いゲージ（管理画面と同じ） */
  .sum { display: flex; align-items: center; gap: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; margin: -8px 0 4px; }
  .sum:empty { display: none; }
  .gring { width: 84px; height: 84px; flex: none; }
  .gring circle { fill: none; stroke-width: 8; }
  .gring .track { stroke: var(--line); }
  .gring .val { stroke: var(--matcha); stroke-linecap: round; transition: stroke-dasharray .6s cubic-bezier(.2,.8,.2,1); }
  .gring .n { font-size: 21px; font-weight: 700; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .gring .n tspan { font-size: 13px; font-weight: 600; fill: var(--sub); }
  .gring .l { font-size: 10px; fill: var(--sub); }
  .glg { flex: 1; font-size: 13px; }
  .gcap { font-size: 12px; color: var(--sub); margin-bottom: 4px; }
  .gl { display: flex; align-items: center; gap: 8px; margin: 4px 0; color: var(--sub); }
  .gl i { width: 9px; height: 9px; border-radius: 50%; background: var(--line2); }
  .gl b { margin-left: auto; font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .gl.g i { background: var(--matcha); } .gl.r, .gl.r b { color: var(--red); } .gl.r i { background: var(--red); }
  .gl.a, .gl.a b { color: var(--amber); } .gl.a i { background: var(--amber); }
  .chkchip { flex: none; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--amber-bg); color: var(--amber); }
  .nm small.chk { color: var(--amber); }
  /* 運営メンバーだけ：清掃｜管理 の切り替え（合言葉は聞かない） */
  /* 清掃｜管理の切り替え：大きく、緑の枠、開いている方を緑で塗る（ishiiさん 2026-09-28） */
  .modesw { display: flex; background: var(--card); border: 1.5px solid var(--matcha); border-radius: 999px; padding: 3px; flex: none; }
  .modesw span, .modesw button { display: flex; align-items: center; gap: 4px; border: 0; background: none; font-size: 14px; font-weight: 700; padding: 7px 13px; border-radius: 999px; color: var(--matcha-ink); }
  .modesw svg { width: 16px; height: 16px; }
  .modesw .on { background: var(--matcha); color: #fff; }
  .modesw[hidden] { display: none; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; line-height: 1.6; }

  /* 合言葉 */
  .veil { position: fixed; inset: 0; background: rgba(10,12,10,.5); display: none; align-items: center; justify-content: center;
    z-index: 10; padding: 20px; }
  .veil.on { display: flex; }
  .box { background: var(--card); color: var(--ink); border-radius: 24px; padding: 28px 22px 22px; width: min(92vw, 400px); text-align: center; }
  .box .t { font-size: 20px; font-weight: 700; }
  .box .s { color: var(--sub); margin-top: 6px; font-size: 14px; }
  .box input { width: 100%; font-size: 22px; padding: 14px; border-radius: 14px; border: 1px solid var(--line2);
    background: var(--bg); color: var(--ink); margin: 18px 0 8px; text-align: center; }
  .box .err { color: var(--red); font-size: 14px; min-height: 1.5em; }
  .box .go { width: 100%; height: 54px; font-size: 17px; font-weight: 700; color: #fff; background: var(--matcha);
    border: 0; border-radius: 16px; margin-top: 6px; }

  /* お知らせ */
  .toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(16px); bottom: calc(24px + env(safe-area-inset-bottom));
    background: var(--ink); color: var(--bg); padding: 13px 20px; border-radius: 999px; font-size: 15px; font-weight: 600;
    opacity: 0; transition: .25s; z-index: 20; white-space: nowrap; pointer-events: none; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.bad { background: var(--red); color: #fff; }

  /* 確認（ブラウザ標準の confirm はドメイン名が出て分かりにくいので自前で出す） */
  .sheet { position: fixed; inset: 0; background: rgba(10,12,10,.45); display: none; align-items: flex-end; justify-content: center;
    z-index: 15; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
  .sheet.on { display: flex; }
  .sheet .panel { width: min(100%, 496px); background: var(--card); color: var(--ink); border-radius: 24px; padding: 24px 18px 12px; text-align: center; }
  .sheet .q { white-space: pre-line; font-size: 18px; font-weight: 600; line-height: 1.5; margin-bottom: 18px; }
  .sheet button { display: block; width: 100%; height: 54px; border: 0; border-radius: 16px; font-size: 17px; font-weight: 700; }
  .sheet .yes { background: var(--red); color: #fff; }
  .doneOk { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 50%; border: 2.5px solid var(--matcha); color: var(--matcha); display: flex; align-items: center; justify-content: center; }
  .doneOk svg { width: 30px; height: 30px; }
  .doneSub { white-space: pre-line; font-size: 13px; color: var(--sub); line-height: 1.6; margin: -8px 0 14px; }
  #doneSheet .no { border: 2px solid var(--matcha); color: var(--matcha-ink); font-weight: 700; margin-top: 0; }
  .sheet .no { background: transparent; color: var(--sub); margin-top: 4px; font-weight: 400; }
</style>
</head>
<body>
<main>
  <header>
    <div style="flex:1"><h1 id="date">&nbsp;</h1><div class="sub" id="sync"></div></div>
    <div class="modesw" id="modeSw" hidden><span class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.4-2h6.2l1.4 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.8" r="3.4"/></svg>清掃</span><button data-act="toAdmin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>管理</button></div>
  </header>
  <div class="sum" id="sum"></div>
  <div id="list"><div class="skel s"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="hint" id="hint"></div>

</main>

<input type="file" id="pick" accept="image/*" multiple hidden>

<div class="veil" id="passVeil">
  <form class="box" onsubmit="savePass(event)">
    <div class="t">合言葉を入れてください</div>
    <div class="s">最初の1回だけです</div>
    <input id="passInput" autocomplete="off" autocapitalize="off" enterkeyhint="go">
    <div class="err" id="passErr"></div>
    <button class="go" type="submit">はじめる</button>
  </form>
</div>
<div class="sheet" id="doneSheet">
  <div class="panel">
    <div class="doneOk" id="doneOk"></div>
    <div class="q" id="doneQ"></div>
    <div class="doneSub" id="doneSub"></div>
    <button class="no" data-act="closeDone">閉じる</button>
  </div>
</div>
<div class="sheet" id="sheet">
  <div class="panel">
    <div class="q" id="sheetQ"></div>
    <button class="yes" id="sheetYes"></button>
    <button class="no" id="sheetNo">やめる</button>
  </div>
</div>
<div class="viewer" id="roomSheet">
  <div class="vhead"><div class="t"><span class="rToday" id="rToday"></span><b id="rRoom"></b><div class="rWhen" id="rWhen"></div></div>
    <button class="x" data-act="closeRoom" aria-label="閉じる"></button></div>
  <div class="rbody" id="rBody"></div>
  <div class="rfoot"><button class="bigBtn two sub" id="rAdd" hidden></button><button class="bigBtn" id="rPick"></button></div>
</div>
<div class="viewer" id="partSheet">
  <div class="vhead"><div class="t"><span class="rToday">途中まで清掃報告</span><b id="pRoom"></b><span>やったことに印をつけてください</span></div>
    <button class="x" data-act="closePart" aria-label="閉じる"></button></div>
  <div class="rbody" id="pBody"></div>
  <div class="rfoot"><button class="bigBtn sub" id="pSend">途中まで報告する</button></div>
</div>
<input type="file" id="partPick" accept="image/*" multiple hidden>
<div class="lb" id="lb"><div class="strip" id="lbStrip"></div><button class="x" data-act="closeLb" aria-label="閉じる"></button><div class="count" id="lbCount"></div></div>
<div class="toast" id="toast"></div>

<script>
  // 画面が止まったときに原因が分かるよう、エラーを下に小さく出す
  function showErr(m) { const h = document.getElementById('hint'); if (h) h.textContent = '（エラー：' + m + '）'; }
  window.addEventListener('error', (e) => showErr(e.message));
  window.addEventListener('unhandledrejection', (e) => showErr((e.reason && e.reason.message) || String(e.reason)));
  const API_URL = 'https://ochahouse-clean-api.ishii-8e0.workers.dev';   // Cloudflare Workers（2026-09-26 Google Apps Script から移行）
  const PASS_KEY = 'ochahouse-clean-pass';
  const MAX_SIDE = 1024, QUALITY = 0.5;          // 画質は低くてよい（ishiiさん 2026-09-26）。軽いほど速く送れる
  const PARALLEL = 5;                            // 1枚ずつ、5本同時に送る（受け口は Cloudflare Workers で速い）
  const UPLOAD_TTL = 50 * 60 * 1000;             // Notionに預けた写真は1時間で消えるので、50分を過ぎたら送り直す
    let tasks = [], rooms = [], today = '', picking = null, running = false, passAsked = false;

  // 受け口（Google Apps Script）は普段1〜2秒、ときどき10秒以上かかる。
  // 前回の一覧をこの端末に覚えておき、開いた瞬間に出す（最新は裏で取り直して差し替える）。
  const CACHE_KEY = 'ochahouse-clean-list';
  const jstToday = () => new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
  const nowIsoJst = () => new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 19) + '+09:00';
  let occ = {}, summary = null, showStay = false;
  function setData(d) {
    tasks = d.tasks; today = d.today; rooms = d.rooms || rooms; occ = d.occ || occ; summary = d.summary || null;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ tasks: tasks, today: today, rooms: rooms, occ: occ, summary: summary })); } catch (e) {}
  }
  function loadCache() {
    try {
      const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (c && c.today === jstToday()) { tasks = c.tasks; today = c.today; rooms = c.rooms || []; occ = c.occ || {}; summary = c.summary || null; return true; }
    } catch (e) {}
    return false;
  }

  // ---------------------------------------------------------------- 合言葉
  function getPass() { try { return localStorage.getItem(PASS_KEY) || ''; } catch (e) { return window._pass || ''; } }
  function setPass(v) { window._pass = v; try { v ? localStorage.setItem(PASS_KEY, v) : localStorage.removeItem(PASS_KEY); } catch (e) {} }
  function askPass(msg) {
    passAsked = true;
    document.getElementById('passErr').textContent = msg || '';
    document.getElementById('passVeil').classList.add('on');
    setTimeout(() => document.getElementById('passInput').focus(), 60);
  }
  // 合言葉の種類（運営メンバーなら 清掃｜管理 を切り替えられる）
  const ROLE_KEY = 'ochahouse-role', VIEW_KEY = 'ochahouse-view';
  const lsGet = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
  const lsSet = (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} };
  function showSwitch() { document.getElementById('modeSw').hidden = lsGet(ROLE_KEY) !== 'admin'; }
  async function checkRole() {
    if (lsGet(ROLE_KEY)) { showSwitch(); return; }
    try { lsSet(ROLE_KEY, (await api('whoami')).role); showSwitch(); } catch (e) {}
  }
  function toAdmin() { lsSet(VIEW_KEY, 'admin'); location.href = 'admin/'; }

  function savePass(ev) {
    ev.preventDefault();
    const v = document.getElementById('passInput').value.trim();
    if (!v) return;
    setPass(v); passAsked = false; lsSet(ROLE_KEY, '');
    document.getElementById('passVeil').classList.remove('on');
    load(); pump();
  }

  // ---------------------------------------------------------------- 受け口
  async function upload(b64, filename) {
    const blob = await (await fetch('data:image/jpeg;base64,' + b64)).blob();
    const f = new FormData();
    f.append('pass', getPass()); f.append('file', blob, filename);
    const j = await (await fetch(API_URL, { method: 'POST', body: f })).json();
    if (!j.ok && j.error === 'passcode') { setPass(''); askPass('合言葉がちがいます'); throw { silent: true }; }
    if (!j.ok) throw new Error(j.error || 'エラー');
    return j.data.upload;
  }

  async function api(action, extra) {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ pass: getPass(), action: action }, extra || {})) });
    const j = await res.json();
    if (!j.ok && j.error === 'passcode') { setPass(''); askPass('合言葉がちがいます'); throw { silent: true }; }
    if (!j.ok) throw new Error(j.error || 'エラー');
    return j.data;
  }

  // ---------------------------------------------------------------- 送信待ちの保管（この端末の IndexedDB）
  // iPhoneのSafariやLINEの中のブラウザでは IndexedDB が開けない・返事が来ないことがある。
  // その時はこの画面を開いている間だけの保管に切り替え、一覧の表示は止めない。
  const mem = new Map();
  let dbp = null;
  function db() {
    if (!dbp) dbp = new Promise((ok) => {
      const t = setTimeout(() => ok(null), 1500);
      try {
        const r = indexedDB.open('ochahouse-clean', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('jobs', { keyPath: 'id' });
        r.onsuccess = () => { clearTimeout(t); ok(r.result); };
        r.onerror = r.onblocked = () => { clearTimeout(t); ok(null); };
      } catch (e) { clearTimeout(t); ok(null); }
    });
    return dbp;
  }
  function tx(mode, fn, fallback) {
    return db().then((d) => new Promise((ok) => {
      if (!d) return ok(fallback());
      try {
        const t = d.transaction('jobs', mode), st = t.objectStore('jobs'), q = fn(st);
        t.oncomplete = () => ok(q && q.result !== undefined ? q.result : undefined);
        t.onerror = t.onabort = () => ok(fallback());
      } catch (e) { ok(fallback()); }
    }));
  }
  async function jobs() { return (await tx('readonly', st => st.getAll(), () => Array.from(mem.values()))) || []; }
  function putJob(j) { mem.set(j.id, j); return tx('readwrite', st => { st.put(j); }, () => {}); }
  function delJob(id) { mem.delete(id); return tx('readwrite', st => { st.delete(id); }, () => {}); }

  // ---------------------------------------------------------------- 画面
  function esc(s) { return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function hm(iso) { const m = /T([0-9][0-9]:[0-9][0-9])/.exec(iso || ''); return m ? m[1] : ''; }
  function toast(msg, bad) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast on' + (bad ? ' bad' : '');
    clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast' + (bad ? ' bad' : ''), bad ? 5000 : 2600);
  }

  const WDS = '日月火水木金土';
  const ICON_CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.4-2h6.2l1.4 2h2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.8" r="3.4"/></svg>';
  const ICON_ADD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V11"/><path d="m4 16 4.5-4.5 5 5"/><path d="m14 15 1.5-1.5 4.5 4.5"/><path d="M19 3v6M16 6h6"/></svg>';
  const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.3 2.6 2.6 5-5.2"/></svg>';
  const ICON_LEAF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14"/><path d="M5 19c3-4 6-7 10-9"/></svg>';

  function mdw(ymd) { const d = new Date(ymd + 'T00:00:00+09:00'); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + WDS[d.getDay()]; }
  function rel(ymd) {
    const n = Math.round((new Date(ymd + 'T00:00:00+09:00') - new Date(today + 'T00:00:00+09:00')) / 86400000);
    return n === 0 ? '今日' : n === 1 ? '明日' : n === -1 ? '昨日' : mdw(ymd);
  }
  const dueDay = (t) => (t.due || '').slice(0, 10);
  const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';

  // ---------------------------------------------------------------- 写真を大きく見る
  let lbUrls = [];
  function zoom(i) {
    const st = document.getElementById('lbStrip');
    st.innerHTML = lbUrls.map(u => '<div><img src="' + esc(u) + '" alt=""></div>').join('');
    document.getElementById('lb').classList.add('on');
    st.scrollLeft = st.clientWidth * i;
    const cnt = () => document.getElementById('lbCount').textContent = (Math.round(st.scrollLeft / st.clientWidth) + 1) + ' / ' + lbUrls.length;
    st.onscroll = cnt; cnt();
  }
  function closeLb() { document.getElementById('lb').classList.remove('on'); }
  function miniRing(j) {
    const all = j.photos.length || 1, sent = j.uploads.filter(Boolean).length, C = 2 * Math.PI * 16;
    return '<svg class="mini' + (j.state === 'waiting' ? ' wait' : '') + '" viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="16"/>'
      + '<circle class="val" cx="20" cy="20" r="16" stroke-dasharray="' + (C * sent / all).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 20 20)"/>'
      + '<text x="20" y="23.5" text-anchor="middle">' + sent + '/' + j.photos.length + '</text></svg>';
  }
  function jobNote(j) {
    const sent = j.uploads.filter(Boolean).length;
    if (j.state === 'waiting') return '<small class="warn">電波が戻ったら続きを自動で送ります</small>';
    if (j.state === 'preparing') return '<small>写真を準備しています…</small>';
    return '<small>' + (sent === j.photos.length ? '完了にしています…' : '写真を送っています…') + '</small>';
  }

  // 部屋名：施設を小さく上に、部屋番号を大きく
  const splitRoom = (r) => { const i = r.indexOf(' '); return i < 0 ? ['', r] : [r.slice(0, i), r.slice(i + 1)]; };
  function roomName(r) { const f = splitRoom(r); return (f[0] ? '<span class="fac">' + esc(f[0]) + '</span>' : '') + esc(f[1]); }
  const md = (ymd) => (ymd.slice(5, 7) * 1) + '/' + (ymd.slice(8) * 1);
  const dwk = (ymd) => md(ymd) + '（' + WDS[new Date(ymd + 'T00:00:00+09:00').getDay()] + '）';
  const nowHm = () => new Date(Date.now() + 9 * 3600000).toISOString().slice(11, 16);
  // まだゲストがいる清掃（OUTが明日以降、または今日でOUT時刻の前）＝「チェックアウト待ち」。OUT時刻を過ぎたら「清掃待ち」へ
  const later = (t) => t.day > today || (t.day === today && !!t.out && nowHm() < t.out);

  function row(t, j, isLater) {
    const early = /アーリー/.test(t.deadline);
    let sub = '';
    // OUTは前のゲストのもの。今日・明日にも日付を添える（ishiiさん 2026-09-28）
    const outDay = (['今日', '明日', '昨日'].includes(rel(t.day)) ? rel(t.day) + ' ' : '') + md(t.day) + (t.out ? ' ' + t.out : '');
    if (t.day) sub = isLater ? '今のゲスト ' + outDay + ' OUT後' : '前のゲスト ' + outDay + ' OUT';   // 「清掃待ち」は空室なので「空室」は書かない
    sub = j ? jobNote(j) : sub ? '<small>' + sub + '</small>' : '';
    const note = t.note && !j ? '<span class="note">' + esc(t.note) + '</span>' : '';
    const inner = '<div class="tm">' + (t.due ? '<small class="i">IN</small>' + hm(t.due) + '<small>までに清掃</small>' : '—') + '</div><div class="nm">' + roomName(t.room)
      + (early ? '<span class="tag early">アーリーIN</span>' : '') + (t.partial ? '<span class="tag part">途中</span>' : '') + sub
      + (t.partial && !j ? '<small class="part">' + esc(t.partial.split('／').pop()) + '</small>' : '') + note + '</div>'
      + (j ? miniRing(j) : isLater ? '<span class="stay">滞在中</span>' : '<div class="cam">' + ICON_CAM + '</div>');
    if (j) return '<div class="row">' + inner + '</div>';
    // カメラのボタン＝そのまま写真を選ぶ。それ以外のところ＝部屋の画面（入室方法と「写真を選んで完了」）（ishiiさん 2026-09-27）
    // 「チェックアウト待ち」はカメラを出さない。ゲストが早く出たときは部屋の画面から報告できる
    return '<div class="row" role="button" tabindex="0" data-act="room" data-id="' + t.id + '">'
      + inner.replace('<div class="cam">', '<button class="cam" data-act="pick" data-id="' + t.id + '" aria-label="' + esc(t.room) + ' の写真を選んで完了">').replace(/<\/div>$/, '</button>') + '</div>';
  }

  // 期限の日付ごとに区切り、左に期限の時刻（K案の時間軸。赤は期限が今日・過ぎたものだけ）
  function timeline(list, isLater, live) {
    const groups = new Map();
    const key = (t) => !t.due ? 'none' : dueDay(t) < today ? 'over' : dueDay(t);
    list.slice().sort((a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : 1).forEach(t => {
      const k = key(t); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t);
    });
    let h = '';
    groups.forEach((ts, k) => {
      // 日付を大きく、本日・明日はタグ、右に小さく「チェックイン」（ishiiさん 2026-09-28）
      const label = k === 'over' ? '<span class="dd">期限切れ（急いでください）</span>' : k === 'none' ? '<span class="dd">次の予約なし（期限なし）</span>'
        : (k === today ? '<span class="dtag hot">本日</span>' : rel(k) === '明日' ? '<span class="dtag">明日</span>' : '') + '<span class="dd">' + dwk(k) + '</span><span class="dr">チェックイン</span>';
      h += '<div class="grp' + (k === 'over' || k === today ? ' hot' : '') + '"><div class="dh">' + label + '</div>' + ts.map(t => row(t, live(t.id), isLater)).join('') + '</div>';
    });
    return h;
  }

  // 今日のまとめ：今日INの部屋のうち準備OKの割合を丸いゲージで（管理画面と同じ数。ishiiさん 2026-09-27）
  function gauge(sm) {
    const C = 2 * Math.PI * 34, check = sm.check || 0, rest = sm.in - sm.done - check, late = sm.late || 0;
    const arc = sm.in && sm.done ? '<circle class="val" cx="44" cy="44" r="34" stroke-dasharray="' + (C * sm.done / sm.in).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 44 44)"/>' : '';
    return '<svg class="gring" viewBox="0 0 88 88"><circle class="track" cx="44" cy="44" r="34"/>' + arc
      + (sm.in ? '<text x="44" y="46" text-anchor="middle" class="n">' + sm.done + '<tspan>/' + sm.in + '</tspan></text><text x="44" y="62" text-anchor="middle" class="l">準備OK</text>'
               : '<text x="44" y="50" text-anchor="middle" class="l">—</text>') + '</svg>'
      + '<div class="glg"><div class="gcap">' + (sm.in ? '今日のチェックイン ' + sm.in + '部屋' : '今日のチェックインはありません') + '</div>'

      + (late ? '<div class="gl r"><i></i>期限切れ<b>' + late + '</b></div>' : '') + '</div>';
  }

  // 清掃の予定が無い部屋：清掃済み（空室・次のゲスト待ち）と滞在中に分ける
  function idleRooms(todo, done, js) {
    const busy = new Set(todo.map(t => t.room).concat(Object.values(js).filter(j => j.state !== 'completing').map(j => j.room)));
    const ready = [], stay = [];
    rooms.forEach(r => {
      if (busy.has(r)) return;
      const o = occ[r] || {};
      if (o.state === 'stay') { stay.push({ r: r, out: o.out }); return; }
      let last = o.lastDone || '';   // 受け口の記録と、この画面で完了にしたばかりの部屋の新しい方
      done.filter(t => t.room === r).forEach(t => { if ((t.doneAt || '') > last) last = t.doneAt; });
      // 要確認：前のゲストのOUTのあとの清掃の記録が無い（この画面で完了にしたばかりなら消す）
      const check = !!o.check && !(last && last.slice(0, 10) >= (o.lastOut || ''));
      ready.push({ r: r, last: last, nextIn: o.nextIn || '', nextTin: o.nextTin || '', check: check, lastOut: o.lastOut || '' });
    });
    ready.sort((a, b) => (a.nextIn || '9999') < (b.nextIn || '9999') ? -1 : (a.nextIn || '9999') > (b.nextIn || '9999') ? 1 : rooms.indexOf(a.r) - rooms.indexOf(b.r));
    return { ready: ready, stay: stay };
  }

  // 4つに分ける：清掃待ち／チェックアウト待ち／清掃済み／滞在中（ishiiさん 2026-09-27）

        + '<div class="secNote">ゲストが早く出たときは、部屋を押すと報告できます</div>';

        + (x.check ? '<small class="chk">' + (x.lastOut ? md(x.lastOut) + ' OUT後の清掃記録なし' : '清掃の記録なし') + '</small>' : '<small>' + (x.last ? md(x.last.slice(0, 10)) + ' ' + hm(x.last) + ' 完了' : '空室・記録なし') + '</small>')
        + '<small>' + (x.nextIn === today ? '今日' + (x.nextTin ? ' ' + x.nextTin + ' ' : '') + 'IN' : x.nextIn ? '次のIN ' + md(x.nextIn) : '次の予約なし') + '</small></div>'
        + (x.check ? '<span class="chkchip">要確認</span>' : x.last ? '<span class="okchip">完了</span>' : '') + '</button>').join('') + '</div>'
        + '<div class="secNote">押すと前回の写真・入室方法・清掃の報告</div>';
    }
    if (idle.stay.length) {
      h += '<div class="sec dim"><b>滞在中</b><span>' + idle.stay.length + '部屋</span></div><div class="card">'
        + (showStay ? idle.stay.map(x => '<button class="row idle" data-act="roomFree" data-id="' + esc(x.r) + '"><div class="nm">' + roomName(x.r)
              + '<small>' + md(x.out) + ' OUT</small></div></button>').join('') + '<button class="row more" data-act="stayToggle"><span class="rep">閉じる ▴</span></button>'
            : '<button class="row more" data-act="stayToggle"><span class="nm"><small>' + idle.stay.map(x => esc(x.r) + '（' + md(x.out) + ' OUT）').join('・')
              + '</small></span><span class="rep">ひらく ▾</span></button>') + '</div>';

    document.getElementById('list').innerHTML = h;

  // ---------------------------------------------------------------- 写真を選ぶ → 縮める → 保管
  let pickRoom = '';
  function pick(id, room) { picking = id; pickRoom = room || ''; const p = document.getElementById('pick'); p.value = ''; p.click(); }

  function shrink(file) {
    return new Promise((resolve, reject) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        const s = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', QUALITY).split(',')[1]);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('写真を読み込めませんでした')); };
      img.src = url;
    });
  }

  document.getElementById('pick').addEventListener('change', async (ev) => {
    const files = Array.from(ev.target.files || []);
    const id = picking; picking = null;
    if (!files.length || !id) return;
    const t = tasks.find(x => x.id === id);
    const job = { id: id, room: t ? t.room : pickRoom || id.replace(/^room:/, ''), photos: [], uploads: [], at: [], state: 'preparing', created: Date.now() };
    await putJob(job); render();
    for (const f of files) {
      try { job.photos.push(await shrink(f)); } catch (e) { /* 読めない写真は飛ばす */ }
      job.uploads.push(null); job.at.push(0);
      await putJob(job); render();
    }
    if (!job.photos.length) { await delJob(id); render(); toast('写真を読み込めませんでした。もう一度選んでください', true); return; }
    job.state = 'sending'; await putJob(job);
    pump();
  });

  // ---------------------------------------------------------------- 送信（1枚ずつ。失敗しても保管したまま、あとで続きから）
  async function pump() {
    if (running || !getPass()) return;
    running = true;
    try {
      for (const job of await jobs()) {
        if (job.state === 'preparing' && Date.now() - job.created < 5 * 60 * 1000) continue;  // まだ写真を縮めている途中
        job.state = 'sending'; await putJob(job); render();
        try {
          // まだ届いていない写真を、PARALLEL 本ずつ同時に1枚ずつ送る
          const todoIdx = job.photos.map((_, i) => i).filter(i => !(job.uploads[i] && Date.now() - job.at[i] < UPLOAD_TTL));
          const worker = async () => {
            for (let i = todoIdx.shift(); i !== undefined; i = todoIdx.shift()) {
              job.uploads[i] = await upload(job.photos[i], 'photo' + (i + 1) + '.jpg'); job.at[i] = Date.now();
              await putJob(job); render();
            }
          };
          await Promise.all(Array.from({ length: PARALLEL }, worker));
          const room = job.id.indexOf('room:') === 0 ? job.id.slice(5) : '';
          if (job.id.indexOf('part:') === 0) {   // 途中まで清掃報告（完了にはしない）
            job.state = 'completing'; await putJob(job);
            setData(await api('partial', { id: job.id.slice(5), items: job.items || [], memo: job.memo || '', uploads: job.uploads.filter(Boolean) }));
            await delJob(job.id); render(); toast(job.room + ' 途中まで報告しました');
            continue;
          }
          if (job.id.indexOf('add:') === 0) {   // 前回の清掃に写真を足すだけ（完了時刻は変えない）
            job.state = 'completing'; await putJob(job);
            setData(await api('addPhotos', { id: job.id.slice(4), uploads: job.uploads.filter(Boolean) }));
            await delJob(job.id); render(); toast(job.room + ' 写真を追加しました');
            continue;
          }
          // 写真が全部届いたら、返事を待たずに画面上は完了にする（失敗したら元に戻して再送）
          job.state = 'completing'; await putJob(job);
          const n = job.uploads.filter(Boolean).length, t = tasks.find(x => x.id === job.id);
          const tmp = { id: 'tmp-' + job.id, room: job.room, done: true, doneAt: nowIsoJst(), photos: n };
          if (t) Object.assign(t, { done: true, doneAt: tmp.doneAt, photos: n }); else tasks.push(tmp);
          render();
          try {
            setData(await api('complete', room ? { room: room, uploads: job.uploads.filter(Boolean) }
                                                : { id: job.id, uploads: job.uploads.filter(Boolean) }));
          } catch (e) {
            if (t) t.done = false; else tasks = tasks.filter(x => x !== tmp);
            throw e;
          }
          await delJob(job.id);
          render();
          doneSheet(job.room, n, tmp.doneAt);   // 受け口が受け取ってから「報告しました」を出す
        } catch (e) {
          if (e && e.silent) break;
          job.state = 'waiting'; await putJob(job); render();
        }
      }
    } finally { running = false; }
  }

  // ---------------------------------------------------------------- 報告しました（通知するかは選ばせない。LINEへは見張りが5分おきに送る。ishiiさん 2026-09-28）
  function doneSheet(room, n, at) {
    document.getElementById('doneOk').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 12.5 4 4 8-8.5"/></svg>';
    document.getElementById('doneQ').textContent = room + ' の清掃を\nLINE に報告しました';
    document.getElementById('doneSub').textContent = '写真 ' + n + '枚・' + md(at.slice(0, 10)) + ' ' + hm(at) + '\n（LINE への反映は最大5分かかります）';
    document.getElementById('doneSheet').classList.add('on');
  }
  function closeDone() { document.getElementById('doneSheet').classList.remove('on'); }
  document.getElementById('doneSheet').addEventListener('click', (e) => { if (e.target.id === 'doneSheet') closeDone(); });

  // ---------------------------------------------------------------- 確認
  function ask(q, yes) {
    return new Promise((ok) => {
      const el = document.getElementById('sheet');
      document.getElementById('sheetQ').textContent = q;
      document.getElementById('sheetYes').textContent = yes;
      const done = (v) => { el.classList.remove('on'); el.onclick = null; ok(v); };
      el.onclick = (e) => {
        if (e.target.id === 'sheetYes') done(true);
        else if (e.target.id === 'sheetNo' || e.target === el) done(false);
      };
      el.classList.add('on');
    });
  }

  // ---------------------------------------------------------------- 取り消し
  // 前の日の完了（一覧に無い記録）も取り消す。必ず確認を出す
  let undoInfo = null;
  async function undoAny(u) {
    if (tasks.some(t => t.id === u.id && t.done)) { undo(u.id); return; }   // 今日の完了はいつもの取り消し
    const when = u.at ? md(u.at.slice(0, 10)) + ' ' + hm(u.at) + ' の' : '';
    if (!(await ask(u.room + ' の' + when + '完了を\n本当に取り消しますか？\n（送った写真も外れます）', '取り消す'))) return;
    try { setData(await api('undo', { id: u.id })); render(); toast('取り消しました'); }
    catch (e) { if (!e.silent) toast('取り消せませんでした。もう一度押してください', true); }
  }
  async function undo(id, confirmed) {
    const t = tasks.find(x => x.id === id);
    if (t && id.indexOf('tmp-') === 0) { toast('送信の仕上げ中です。数秒後にもう一度押してください', true); return; }
    if (!t || (!confirmed && !(await ask(t.room + ' の完了を\n本当に取り消しますか？\n（送った写真も外れます）', '取り消す')))) return;
    // 返事を待たずに画面を戻す。失敗したら元に戻す
    const before = { done: t.done, doneAt: t.doneAt };
    if (t.deadline === '一覧外の清掃') tasks = tasks.filter(x => x !== t); else Object.assign(t, { done: false, doneAt: '' });
    render(); toast('取り消しました');
    try { setData(await api('undo', { id: id })); render(); }
    catch (e) {
      if (!tasks.includes(t)) tasks.push(t);
      Object.assign(t, before); render();
      if (!e.silent) toast('取り消せませんでした。もう一度押してください', true);
    }
  }

  // 前のゲストOUT → 次のゲストIN。名前と予約サイトは出さない
  const ICON_MOON = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7.5 7.5 0 0 0 8.3 12.4A9 9 0 1 1 12 3z"/></svg>';   // 泊数（ishiiさん 2026-09-28）

  // 清掃の予定が無い部屋（完了済みの空室）：入室方法・前回の写真・前回の清掃に写真を追加・新規の清掃を報告
  async function openRoomFree(room) {
    const o = occ[room] || {};
    let lastDone = o.lastDone || '', lastId = o.lastId || '';
    tasks.filter(t => t.done && t.room === room && t.id.indexOf('tmp-') !== 0).forEach(t => { if ((t.doneAt || '') >= lastDone) { lastDone = t.doneAt; lastId = t.id; } });

    document.getElementById('rRoom').textContent = room;
    document.getElementById('rWhen').className = 'rWhen';
    document.getElementById('rWhen').textContent = o.state === 'stay' ? '滞在中（' + md(o.out) + ' OUT）'
      : lastDone ? md(lastDone.slice(0, 10)) + ' ' + hm(lastDone) + ' 完了' : '清掃の記録なし';
    // 最後の完了はここから取り消せる。前の日の完了も（部屋を間違えて報告し、後日気づいたとき。ishiiさん 2026-09-28）
    const undoable = !!lastId;
    undoInfo = lastId ? { id: lastId, room: room, at: lastDone } : null;
    const btn = document.getElementById('rPick'), add = document.getElementById('rAdd');
    btn.innerHTML = ICON_CAM + '<span>新規の清掃を<br>報告</span>'; btn.classList.add('sub', 'two');
    add.innerHTML = ICON_ADD + '<span>前回の清掃に<br>写真を追加</span>'; add.classList.add('two'); add.hidden = !lastId;
    const addTo = lastId ? { id: 'add:' + lastId, room: room } : null;
    leftAct = () => { if (addTo) pick(addTo.id, addTo.room); };
    const nextB = o.nextIn ? { in: o.nextIn, tin: o.nextTin, n: o.nextN, nights: o.nextNights } : null;
    document.getElementById('rBody').innerHTML = (o.state === 'stay' ? '' : guestCards(null, nextB, false, false)) + (lastId ? '<button class="lastPhotos" data-act="lastPhotos" data-id="' + lastId + '">前回の清掃の写真を見る ›</button><div class="pgrid" id="rPhotos"></div>' : '')
      + '<div class="rsec">入室方法</div><div id="rKeys"><div class="key"><div class="knote">読み込み中…</div></div></div>'
      + (undoable ? '<button class="undoLink" data-act="undoLast" data-id="' + lastId + '">この完了を取り消す</button>' : '');
    document.getElementById('roomSheet').classList.add('on');
    loadKeys(room, roomOpen);
  }
  // 前回の写真を部屋の画面の中に一覧で出す（もう一度押すと閉じる）。1枚押すと大きく（ishiiさん 2026-09-27）
  async function lastPhotos(id) {
    const box = document.getElementById('rPhotos');
    if (!box) return;
    if (box.innerHTML) { box.innerHTML = ''; return; }
    box.innerHTML = '<div class="pmsg">読み込み中…</div>';
    try {
      const d = await api('photos', { id: id });
      if (!box.isConnected) return;
      lbUrls = d.urls;
      box.innerHTML = d.urls.length ? d.urls.map((u, i) => '<button data-act="zoom" data-id="' + i + '"><img src="' + esc(u) + '" loading="lazy" alt=""></button>').join('')
                                    : '<div class="pmsg">写真はありません</div>';
    } catch (e) { if (!e.silent && box.isConnected) box.innerHTML = '<div class="pmsg">写真を読み込めませんでした</div>'; }
  }

  // ---------------------------------------------------------------- 途中まで清掃報告（ゴミ出しだけ等。完了にはしない）
  // 作業の流れの順に分けて並べる（ishiiさん 2026-09-28）。名前に「・」は使わない（報告の中で項目をつなぐ記号なので）
  // 見出しに緑のアイコン（ゴミ箱・洗濯機・箒・箱・ペン。ishiiさん 2026-09-28）
  const svgI = (d) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
  const PART_GROUPS = [
    ['片付け', ['ゴミ出し', '忘れ物チェック'], svgI('<path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>')],
    ['リネン', ['リネン回収', '洗濯乾燥', 'ベッドメイク'], svgI('<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M8 6h.01M11 6h.01"/>')],
    ['掃除', ['水回り', '床掃除', '換気'], svgI('<path d="M20 3l-7.5 7.5"/><path d="M10 9l5 5"/><path d="M10 9l-5.5 5.5C4 17 5.5 19.5 8 20.5l5-6.5"/><path d="M6.5 17.5l2 2M8.5 15.5l2 2"/>')],
    ['補充', ['アメニティ補充'], svgI('<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM12 12l8-4.5M12 12v9M12 12L4 7.5"/>')],
    ['その他', ['その他'], svgI('<path d="M4 20h4L18.5 9.5a2.8 2.8 0 0 0-4-4L4 16v4M13.5 6.5l4 4"/>')],
  ];
  const PART_ITEMS = PART_GROUPS.reduce((a, g) => a.concat(g[1]), []);
  let partOpen = null, partFiles = [];
  function openPartial(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    partOpen = id; partFiles = [];
    document.getElementById('pRoom').textContent = t.room;
    document.getElementById('pBody').innerHTML = PART_GROUPS.map(g => '<div class="pgh">' + g[2] + g[0] + '</div><div class="chkl">'
        + g[1].map(x => '<label><input type="checkbox" value="' + x + '"' + (x === 'その他' ? ' id="pOther"' : '') + '>' + x + '</label>').join('')
        + (g[0] === 'その他' ? '<input class="pother" id="pOtherText" placeholder="何をしたか（例：窓拭き）" hidden>' : '') + '</div>').join('')
      + '<div class="rsec">メモ（任意）</div><textarea class="pmemo" id="pMemo" placeholder="例：続きは明日の午前にやります"></textarea>'
      + '<div class="rsec">写真（任意）</div><button class="ppick" data-act="partPick" id="pPickBtn">＋ 写真を選ぶ</button>';
    document.getElementById('partSheet').classList.add('on');
  }
  // 途中まで清掃報告の進み具合：済んだ項目に✓、まだの項目は○。下に報告の履歴（ishiiさん 2026-09-28）
  function progress(partial) {
    if (!partial) return '';
    const segs = partial.split('／'), done = new Set();
    // 1件は「9/28 10:12 ゴミ出し・リネン回収 済み（メモ）」
    segs.forEach(x => { const m = /^\S+ \S+ (.+?) 済み/.exec(x); if (m) m[1].split('・').forEach(i => done.add(i)); });
    const others = Array.from(done).filter(i => /^その他/.test(i));   // 「その他：窓拭き」
    const items = PART_ITEMS.filter(i => i !== 'その他').concat(others);
    return '<div class="rsec">途中まで清掃済み</div><div class="prog"><div class="pchips">'
      + items.map(i => '<span class="pchip' + (done.has(i) ? ' on' : '') + '">' + (done.has(i) ? '✓ ' : '') + esc(i) + '</span>').join('') + '</div>'
      + segs.map(x => '<div class="phist">' + esc(x) + '</div>').join('') + '<div class="pgrid part" id="rPartPhotos"></div></div>';
  }
  // 途中の報告で送った写真（ページ本文の写真）を最初から一覧で出す。1枚押すと大きく
  async function partPhotos(id) {
    const box = document.getElementById('rPartPhotos');
    if (!box) return;
    try {
      const d = await api('photos', { id: id });
      if (!box.isConnected || roomOpen !== id) return;
      lbUrls = d.urls;
      box.innerHTML = d.urls.map((u, i) => '<button data-act="zoom" data-id="' + i + '"><img src="' + esc(u) + '" loading="lazy" alt=""></button>').join('');
    } catch (e) { /* 写真が読めなくても報告の中身は出ている */ }
  }
  function closePart() { partOpen = null; partFiles = []; document.getElementById('partSheet').classList.remove('on'); }
  // その他に印をつけたら、何をしたか書ける欄を出す
  document.getElementById('pBody').addEventListener('change', (ev) => {
    if (ev.target.id !== 'pOther') return;
    const t = document.getElementById('pOtherText');
    t.hidden = !ev.target.checked;
    if (ev.target.checked) t.focus();
  });
  document.getElementById('partPick').addEventListener('change', (ev) => {
    partFiles = Array.from(ev.target.files || []);
    const b = document.getElementById('pPickBtn');
    if (b) b.textContent = partFiles.length ? '写真 ' + partFiles.length + '枚（選び直す）' : '＋ 写真を選ぶ';
  });
  document.getElementById('pSend').addEventListener('click', async () => {
    const id = partOpen, t = tasks.find(x => x.id === id);
    if (!t) return;
    const other = (document.getElementById('pOtherText').value || '').trim().replace(/[・／]/g, '、');
    const items = Array.from(document.querySelectorAll('#pBody input:checked')).map(x => x.value === 'その他' && other ? 'その他：' + other : x.value),
      memo = document.getElementById('pMemo').value.trim();
    if (!items.length && !memo) { toast('やったことに印をつけてください', true); return; }
    const files = partFiles;
    closePart();
    // 写真の有無にかかわらず送信待ちに入れる（電波が無くても後で送る）
    const job = { id: 'part:' + id, room: t.room, items: items, memo: memo, photos: [], uploads: [], at: [], state: 'preparing', created: Date.now() };
    await putJob(job); render();
    for (const f of files) {
      try { job.photos.push(await shrink(f)); job.uploads.push(null); job.at.push(0); } catch (e) { /* 読めない写真は飛ばす */ }
      await putJob(job); render();
    }
    job.state = 'sending'; await putJob(job);
    pump();
  });

  function closeRoom() { roomOpen = null; document.getElementById('roomSheet').classList.remove('on'); document.getElementById('rKeys') && (document.getElementById('rBody').innerHTML = ''); }
  document.getElementById('rPick').addEventListener('click', () => { const id = roomOpen; closeRoom(); if (id) pick(id); });  // 予定の無い部屋は id が room:部屋名 ＝一覧外の清掃として報告
  document.getElementById('rAdd').addEventListener('click', () => { const f = leftAct; closeRoom(); if (f) f(); });

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    ({ roomFree: openRoomFree, lastPhotos: lastPhotos, toAdmin: toAdmin, room: openRoom, closeRoom: closeRoom, pick: pick, zoom: (i) => zoom(+i), closeLb: closeLb,
       undoLast: () => { const u = undoInfo; closeRoom(); if (u) undoAny(u); }, closePart: closePart, closeDone: closeDone,
       partPick: () => { const p = document.getElementById('partPick'); p.value = ''; p.click(); }, stayToggle: () => { showStay = !showStay; render(); } })[b.dataset.act](b.dataset.id);
  });
  window.addEventListener('online', pump);
  // ---------------------------------------------------------------- 新しい版があれば読み直す
  // GitHub Pages はスマホがページを最大10分覚えている。開いたとき・画面に戻ったときに最新のページを取り、
  // 版の目印（BUILD）が違えば読み直す。公開のたびに bump.sh で目印を書き換える（ishiiさん 2026-09-29）
  const BUILD = '2026-09-29-181930';
  async function checkUpdate() {
    if (running || document.querySelector('.viewer.on, .sheet.on')) return;                                  // 作業中は読み直さない
    try {
      const t = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text();
      const m = /BUILD = '([0-9-]+)'/.exec(t);   // 最初に出てくる目印（上の行）
      if (!m || m[1] === BUILD) return;
      try { if (sessionStorage.getItem('ochahouse-build-try') === m[1]) return; sessionStorage.setItem('ochahouse-build-try', m[1]); } catch (e) {}   // 同じ版へ何度も読み直さない
      location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    } catch (e) { /* 電波が悪いときはそのまま */ }
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); pump(); checkUpdate(); } });
  setInterval(() => { if (!document.hidden && !passAsked) { load(); pump(); } }, 60000);
  // 運営メンバーが前回「管理」を見ていたら、そのまま管理画面を開く
  if (lsGet(ROLE_KEY) === 'admin' && lsGet(VIEW_KEY) === 'admin' && getPass()) location.replace('admin/');
  showSwitch();
  document.querySelectorAll('.x').forEach(b => b.innerHTML = ICON_X);
  if (loadCache()) render();
  load(); pump(); checkUpdate();
</script>
</body>
</html>
